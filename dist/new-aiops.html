<body class="aiops-body">
  <div class="aiops-app has-page-tabs">
    <aside class="aiops-side" aria-label="AI Ops navigation">
      <!-- Home, scenario switcher, and sidebar toggle -->
      <div class="aiops-brand-bar">
        <a class="aiops-home-btn" href="index.html" title="Back to Workbench" aria-label="Back to Workbench">
          <i data-lucide="house"></i>
        </a>
        <button class="brand-picker aiops-scene-picker" id="teamBtn" type="button" data-i18n-aria="切换场景" aria-label="切换场景" aria-haspopup="menu" aria-controls="teamMenu" aria-expanded="false">
          <span class="brand-picker-label" id="teamName">企业全景</span>
          <svg class="chev" width="8" height="8" viewBox="0 0 8 8" fill="none" aria-hidden="true"><path d="M1.5 3L4 5.5L6.5 3" stroke="#333" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="ws-btn" id="aiopsNavToggle" aria-label="收起左侧边栏" aria-expanded="true"><svg class="ws-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15"/></svg></button>
      </div>

      <!-- Primary CTA + navigation -->
      <div class="aiops-team">
        <div class="aiops-new-wrap">
          <button class="btn btn-primary" id="btnNew" type="button" aria-haspopup="menu" aria-expanded="false">
            <i data-lucide="plus" class="btn-ico" aria-hidden="true"></i>
            <span data-i18n="新建">新建</span>
          </button>
          <div class="aiops-dropdown" id="newMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-new="分析任务">
              <i data-lucide="square-pen"></i><span data-i18n="分析任务">分析任务</span>
            </button>
            <button type="button" role="menuitem" data-new="定时任务">
              <i data-lucide="clock"></i><span data-i18n="定时任务">定时任务</span>
            </button>
            <button type="button" role="menuitem" data-new="自定义看板">
              <i data-lucide="layout-grid"></i><span data-i18n="自定义看板">自定义看板</span>
            </button>
          </div>
        </div>

        <div class="aiops-menu-scroll">
          <nav class="aiops-side-nav" id="aiopsNav" aria-label="AI Ops"></nav>
        </div>
      </div>

      <div class="aiops-side-foot">
        <button class="aiops-user" id="userBtn" type="button" data-i18n-aria="账号菜单" aria-label="账号菜单" aria-haspopup="menu" aria-expanded="false">
          <span class="user-avatar">F</span>
          <span class="user-name">Feng Zhu</span>
          <i data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <button type="button" class="aiops-bell" data-page="消息通知" aria-label="消息通知" title="消息通知"><i data-lucide="bell" aria-hidden="true"></i></button>
      </div>
    </aside>

    <div class="aiops-collapsed-nav" id="aiopsCollapsedNav" hidden><a class="ws-btn aiops-collapsed-home" id="aiopsCollapsedHome" href="index.html" aria-label="回到首页" title="回到首页"><svg class="ws-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.9 10.2a1.8 1.8 0 0 1 .638-1.375l6.3-5.399a1.8 1.8 0 0 1 2.324 0l6.3 5.399a1.8 1.8 0 0 1 .638 1.375v8.1a1.8 1.8 0 0 1-1.8 1.8H5.7a1.8 1.8 0 0 1-1.8-1.8Z"/><path d="M14.7 20.1v-7.2a.9.9 0 0 0-.9-.9h-3.6a.9.9 0 0 0-.9.9v7.2"/></svg></a><button type="button" class="ws-btn" id="aiopsNavOpen" aria-label="展开左侧边栏" aria-expanded="false"><svg class="ws-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15"/></svg></button></div>

    <div class="aiops-scroll" id="pageRoot" role="main"></div>
    <aside class="cui-rail resource-panel" id="cuiRail" hidden aria-label="Agent panel">
      <div class="right-panel-inner">
        <div class="right-panel-head resource-panel-head">
          <div class="resource-tabs" id="cuiRailTabs" role="tablist" aria-label="打开的详情"></div>
          <div class="right-panel-actions resource-panel-actions">
            <button type="button" class="ws-btn" id="cuiRailMax" aria-label="Expand agent panel" aria-pressed="false">
              <svg class="ws-ico rail-max-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V6a2 2 0 0 1 2-2h3"/><path d="M15 4h3a2 2 0 0 1 2 2v3"/><path d="M20 15v3a2 2 0 0 1-2 2h-3"/><path d="M9 20H6a2 2 0 0 1-2-2v-3"/></svg>
              <svg class="ws-ico rail-min-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M4 9h3a2 2 0 0 0 2-2V4"/><path d="M15 4v3a2 2 0 0 0 2 2h3"/><path d="M20 15h-3a2 2 0 0 0-2 2v3"/><path d="M9 20v-3a2 2 0 0 0-2-2H4"/></svg>
            </button>
            <button type="button" class="ws-btn" id="cuiRailClose" aria-label="Close agent panel">
              <svg class="ws-ico rail-collapse-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M15 4.5v15"/></svg>
              <svg class="ws-ico rail-close-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </div>
        <div class="right-panel-body" id="cuiRailBody"></div>
        <div class="fd-view" id="cuiRailView" hidden>
          <div class="fd-meta" id="cuiRailMeta"></div>
          <div class="resource-panel-body" id="cuiRailScroll" role="tabpanel"></div>
        </div>
      </div>
    </aside>

      <div class="acct-sep acct-sep-in"></div>
