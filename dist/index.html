xt-anchor="middle" fill="#2587ef" font-size="14">${t}</text>`).join('')}</svg></div>`}</section>`;}
function kbConfigFields(c,prefix='search'){return `<label class="kb-field"><span><i>*</i> 元数据过滤规则</span><select name="metadata"><option>禁用</option><option>自定义</option></select><small>当前知识库下文件集暂无元数据字段定义，仍可手动输入字段名</small></label><label class="kb-field"><span>混合检索策略</span><select name="strategy"><option>RRG</option><option>向量检索</option><option>全文检索</option></select></label>${kbRange('语义相似度','similarity',c.similarity,0,1,.01,prefix)}<label class="kb-field"><span>初始召回数量</span><input name="recall" aria-label="初始召回数量" type="number" min="1" value="${c.recall}" oninput="${prefix==='search'?'kbData().config.recall=Number(this.value)':''}"></label><div class="kb-field"><span>跨语言检索</span><div class="kb-tags" id="kb-languages-${prefix}">${c.languages.map(x=>`<button type="button" onclick="kbToggleLanguage('${x}','${prefix}',this)">${x} ×</button>`).join('')}<button type="button" aria-label="增加检索语言" onclick="kbAddLanguage('${prefix}',this)">⌄</button></div></div><label class="kb-field"><span>重排序模型</span><select name="reranker"><option value="">Please select</option><option>text-reranker-v3</option></select><small>不选择则不启用重排序</small></label><div class="kb-field"><span>结果高亮</span><button type="button" name="highlight" role="switch" aria-label="结果高亮" aria-checked="${c.highlight}" class="kb-switch ${c.highlight?'on':''}" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'));${prefix==='search'?"kbData().config.highlight=this.classList.contains('on')":''}"></button></div>${kbRange('结果返回数量','count',c.count,1,50,1,prefix)}`;}
function kbRange(label,key,value,min,max,step,prefix){return `<label class="kb-field"><span>${label}</span><div class="kb-range"><input aria-label="${label}滑块" name="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" oninput="this.nextElementSibling.value=this.value;${prefix==='search'?`kbData().config.${key}=Number(this.value)`:''}"><input aria-label="${label}" type="number" min="${min}" max="${max}" step="${step}" value="${value}" oninput="this.previousElementSibling.value=this.value;${prefix==='search'?`kbData().config.${key}=Number(this.value)`:''}"></div></label>`;}
function kbToggleLanguage(x,prefix,el){if(prefix==='search')kbData().config.languages=kbData().config.languages.filter(t=>t!==x);el.remove();}
function kbAddLanguage(prefix,el){kbMenu(el,['中文','英文','日文'],i=>{if(prefix==='search'&&!kbData().config.languages.includes(i))kbData().config.languages.push(i);let node=document.createElement('button');node.type='button';node.textContent=i+' ×';node.onclick=()=>kbToggleLanguage(i,prefix,node);el.before(node);});}
function kbRetrieval(){let d=kbData();return `<div class="kb-retrieval"><aside class="kb-box kb-config"><b>检索配置</b><div class="kb-field"><span><i>*</i> 使用哪些知识表示类型检索</span><div class="kb-tags">${d.config.types.map((x,i)=>`<button onclick="kbData().config.types.splice(${i},1);render()">${x} ×</button>`).join('')}<button aria-label="添加知识表示类型" onclick="kbData().config.types.push('default');render()">⌄</button></div></div>${kbConfigFields(d.config)}</aside><section class="kb-box kb-retrieval-main"><form class="kb-query" onsubmit="event.preventDefault();kbRunSearch(this)"><input name="query" aria-label="知识检索内容" required placeholder="输入查询内容以测试搜索结果…" value="${esc(d.query)}"><button class="kb-dark" type="submit">测试搜索</button></form>${!d.searched?'<b style="margin-top:16px">暂无搜索结果</b><p>请先调整左侧参数，再输入查询内容测试检索。结果将展示匹配片段、预览、来源和相关性得分。</p>':`<p>找到 3 条搜索结果</p>${Array.from({length:3},(_,i)=>`<article class="kb-hit"><b>${esc(d.query)} · ${['业务知识','行业说明','操作规范'][i]}</b><p>${d.config.highlight?'<mark>'+esc(d.query)+'</mark>':esc(d.query)}：${kbChinese}</p><small>来源：Docname.doc #${i+1}　相关性得分：${[.96,.89,.82][i]}　Mock</small></article>`).join('')}`}</section></div>`;}
function kbRunSearch(form){let d=kbData();if(!d.config.types.length){toast('请选择知识表示类型');return;}d.query=form.query.value.trim();if(!d.query)return;d.searched=true;render();}
function kbEditLibrary(id=''){let a=kbData().libraries.find(x=>x.id===id);wtModal(a?'编辑知识库':'新建知识库',`<label class="kb-field"><span><i>*</i> 知识库名称</span><input name="name" required maxlength="80" placeholder="Please enter" value="${esc(a?.name||'')}"></label><label class="kb-field"><span>描述</span><div class="kb-count-wrap"><textarea name="description" maxlength="500" placeholder="Please enter..." oninput="this.nextElementSibling.textContent=this.value.length+'/500'">${esc(a?.description||'')}</textarea><span class="kb-counter">${a?.description?.length||0}/500</span></div></label>`,'<button type="submit" class="kb-dark">保存</button>',`kbSaveLibrary(this,'${id}')`);document.querySelector('.wt-backdrop').classList.add('kb-modal');}
function kbSaveLibrary(form,id){let name=form.elements.name.value.trim();if(!name){toast('请输入知识库名称');return;}let d=kbData(),a=d.libraries.find(x=>x.id===id);if(a){a.name=name;a.description=form.description.value.trim();}else{a={id:'kb-'+Date.now(),name,description:form.description.value.trim(),status:'草稿',sets:[]};d.libraries.unshift(a);d.detail=a.id;d.tab='原始文件';}dismiss();render();toast('知识库已保存（Mock）');}
function kbEditSet(){let c=kbData().config;document.getElementById('overlay').innerHTML=`<div class="kb-overlay"><form class="kb-drawer" role="dialog" aria-modal="true" aria-label="新建文件集" onsubmit="event.preventDefault();kbSaveSet(this)"><header><b>新建文件集</b><button type="button" onclick="dismiss()">取消</button><button type="submit" class="kb-dark">保存</button><button type="button" aria-label="关闭新建文件集" onclick="dismiss()">×</button></header><div class="kb-drawer-body"><div class="kb-form-top"><label class="kb-field"><span><i>*</i> 知识文件集名称</span><input name="name" required value="${esc(kbCurrent().name)}"></label><label class="kb-field"><span><i>*</i> 描述</span><div class="kb-count-wrap"><textarea required name="description" maxlength="150" placeholder="知识库的简要说明" oninput="this.nextElementSibling.textContent=this.value.length+'/150'"></textarea><span class="kb-counter">0/150</span></div></label><h4 style="margin-top:34px">知识库</h4><div class="kb-field"><span>自动启用新版本 ⓘ</span><button class="kb-switch" type="button" aria-label="自动启用新版本" role="switch" aria-checked="false" onclick="this.classList.toggle('on');this.setAttribute('aria-checked',this.classList.contains('on'))"></button></div><h4 style="margin-top:40px">静态知识库处理流水线配置</h4><div class="kb-form-grid"><div class="kb-field"><span>流水线配置(Pipeline)</span><div class="kb-radios"><label><input type="radio" name="pipeline" value="内置" checked onchange="document.getElementById('kb-custom-pipeline').hidden=true"> 内置</label><label><input type="radio" name="pipeline" value="自定义" onchange="document.getElementById('kb-custom-pipeline').hidden=false"> 自定义</label></div></div><label class="kb-field"><span><i>*</i> 知识类型</span><select name="knowledgeType"><option>通用</option><option>行业知识</option><option>业务知识</option></select></label></div><label class="kb-field" id="kb-custom-pipeline" hidden><span>自定义 Pipeline</span><select name="customPipeline"><option>行业知识处理流水线</option><option>通用文档处理流水线</option></select></label></div><details class="kb-advanced"><summary>Pipeline高级配置</summary><div class="kb-steps">${['内容解析','知识表达','知识管理'].map((x,i)=>`${i?'<hr>':''}<button type="button" class="${i===1?'active':''}" onclick="kbPipelineStep(${i},this)"><span class="kb-step-dot">${i===0?'✓':i+1}</span>${x}</button>`).join('')}</div><div id="kb-pipeline-content">${kbPipelineExpression(c)}</div></details></div></form></div>`;}
function kbPipelineExpression(c){return `<div class="kb-pipeline"><aside class="kb-type-list"><b>知识表示类型 ⓘ</b><button type="button" class="active" onclick="kbPipelineType('vector',this)">语义向量(Vector)</button><button type="button" onclick="kbPipelineType('tree',this)">结构树(Tree)</button></aside><div id="kb-expression-fields"><b>配置项</b><label class="kb-field"><span><i>*</i> 向量化模型</span><select name="embedding"><option>text-embedding-v3</option><option>text-embedding-v2</option></select><small>当知识库中任意文件被向量化处理后，不可再切换，或将数据清除重新导入</small></label>${kbConfigFields(c,'pipeline')}</div></div>`;}
function kbPipelineStep(i,el){document.querySelectorAll('.kb-steps button').forEach(x=>x.classList.toggle('active',x===el));document.getElementById('kb-pipeline-content').innerHTML=i===1?kbPipelineExpression(kbData().config):i===0?`<div style="padding:16px"><b>内容解析配置</b><label class="kb-field"><span>解析方式</span><select name="parser"><option>默认文档解析</option><option>OCR 解析</option></select></label><label class="kb-field"><span>分段长度</span><input name="chunkSize" type="number" value="512" min="1"></label><label class="kb-field"><span>分段重叠长度</span><input name="overlap" type="number" value="50" min="0"></label></div>`:`<div style="padding:16px"><b>知识管理</b><label class="kb-field"><span>索引更新策略</span><select name="indexStrategy"><option>增量更新</option><option>全量更新</option></select></label><label class="kb-field"><span>版本保留数量</span><input name="versions" type="number" min="1" value="5"></label></div>`;}
function kbPipelineType(type,el){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===el));document.getElementById('kb-expression-fields').innerHTML=type==='vector'?`<b>配置项</b><label class="kb-field"><span><i>*</i> 向量化模型</span><select name="embedding"><option>text-embedding-v3</option></select></label>${kbConfigFields(kbData().config,'pipeline')}`:`<b>配置项</b><label class="kb-field"><span>结构树生成方式</span><select name="treeMode"><option>按文档标题生成</option><option>按段落生成</option></select></label><label class="kb-field"><span>最大层级</span><input name="depth" type="number" value="5" min="1"></label>`;}
function kbSaveSet(form){let name=form.elements.name.value.trim(),description=form.description.value.trim();if(!name||!description){toast('请填写文件集名称和描述');return;}let values={};new FormData(form).forEach((v,k)=>values[k]=v);kbCurrent().sets.push({name,description,folders:['concept'],files:[],config:values});kbData().set=kbCurrent().sets.length-1;kbData().folder='concept';dismiss();render();toast('文件集已保存（Mock）');}
let kbMenuAction=null;
function kbMenu(el,items,action){document.getElementById('kb-pop-menu')?.remove();kbMenuAction=action;let rect=el.getBoundingClientRect(),menu=document.createElement('div');menu.id='kb-pop-menu';menu.className='kb-menu';menu.innerHTML=items.map((t,i)=>`<button onclick="kbInvokeMenu(${i})">${esc(t)}</button>`).join('');menu.dataset.items=JSON.stringify(items);document.body.append(menu);menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-170))+'px';menu.style.top=Math.max(8,Math.min(rect.bottom+4,innerHeight-menu.offsetHeight-8))+'px';setTimeout(()=>document.addEventListener('click',kbCloseMenu,{once:true}),0);}
function kbCloseMenu(){document.getElementById('kb-pop-menu')?.remove();}
function kbInvokeMenu(i){let menu=document.getElementById('kb-pop-menu'),t=JSON.parse(menu.dataset.items)[i],a=kbMenuAction;menu.remove();a(t);}
function kbLibraryMenu(id,el,vector){kbMenu(el,vector?['查看片段','删除']:['打开','编辑','删除'],t=>{if(vector){toast(t==='删除'?'片段已删除（Mock）':'片段：'+kbChinese);return;}if(t==='打开')kbOpen(id);else if(t==='编辑')kbEditLibrary(id);else kbConfirmDelete('知识库',()=>{kbData().libraries=kbData().libraries.filter(x=>x.id!==id);kbData().detail=null;render();});});}
function kbConfirmDelete(name,action){wtModal('删除'+name,`<p>确认删除此${name}？</p>`,'<button type="button" class="kb-dark" id="kb-confirm-delete">删除</button>');document.getElementById('kb-confirm-delete').onclick=()=>{dismiss();action();toast(name+'已删除（Mock）');};}
function kbFolderMenu(set,folder,el){kbData().set=set;kbMenu(el,['新建子文件夹','上传','重命名','移动','开始解析','取消解析','删除'],t=>{if(t==='新建子文件夹'||t==='重命名'){kbNameModal(t,t==='重命名'?folder:'',name=>{let s=kbCurrent().sets[set];if(t==='重命名')s.folders=s.folders.map(x=>x===folder?name:x);else s.folders.push(name);render();});}else if(t==='上传')kbUpload();else if(t==='移动')kbMoveFolder(set,folder);else if(t==='删除')kbConfirmDelete('文件夹',()=>{kbCurrent().sets[set].folders=kbCurrent().sets[set].folders.filter(x=>x!==folder);render();});else{kbCurrent().sets[set].files.forEach(f=>f.status=t==='开始解析'?'解析成功':'已取消');render();toast(t+'完成（Mock）');}});}
function kbNameModal(title,value,action){wtModal(title,wtField('名称',`<input name="name" required value="${esc(value)}">`),'<button type="submit" class="kb-dark">保存</button>','kbSubmitName(this)');window.kbNameAction=action;}
function kbSubmitName(form){let name=form.elements.name.value.trim();if(!name)return;dismiss();window.kbNameAction(name);toast('已保存（Mock）');}
function kbMoveFolder(set,folder){wtModal('移动文件夹',wtField('目标文件集',`<select name="target">${kbCurrent().sets.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select>`),'<button type="submit" class="kb-dark">移动</button>',`kbMoveFolderSave(this,${set},'${esc(folder)}')`);}
function kbMoveFolderSave(form,set,folder){let target=Number(form.elements.target.value);if(target!==set){kbCurrent().sets[set].folders=kbCurrent().sets[set].folders.filter(x=>x!==folder);kbCurrent().sets[target].folders.push(folder);}dismiss();render();toast('文件夹已移动（Mock）');}
function kbUpload(){wtModal('上传文件',`<label class="wt-field"><span>选择文件</span><input type="file" name="files" multiple required></label><p class="hint">支持文档、图片等文件</p>`,'<button type="submit" class="kb-dark">上传</button>','kbUploadSave(this)');}
function kbUploadSave(form){let files=Array.from(form.elements.files.files);let s=kbCurrent().sets[kbData().set];files.forEach(f=>s.files.push({name:f.name,status:'解析成功',enabled:true}));dismiss();render();toast('文件已上传（Mock）');}
function kbNewFile(){kbNameModal('新建文件','',name=>{kbCurrent().sets[kbData().set].files.push({name,status:'解析成功',enabled:true});render();});}
function kbFileMenu(i,el){kbMenu(el,['查看','重命名','开始解析','取消解析','删除'],t=>{let s=kbCurrent().sets[kbData().set];if(t==='查看')kbPreviewFile(i);else if(t==='重命名')kbNameModal(t,s.files[i].name,name=>{s.files[i].name=name;render();});else if(t==='删除')kbConfirmDelete('文件',()=>{s.files.splice(i,1);kbData().selected=[];render();});else{s.files[i].status=t==='开始解析'?'解析成功':'已取消';render();toast(t+'完成（Mock）');}});}
function kbPreviewFile(i){let f=kbCurrent().sets[kbData().set].files[i];wtModal(f.name,`<p>${kbChinese}</p><p>${kbEnglish}</p><small>Mock 文件预览</small>`);}
function kbBatch(el){kbMenu(el,['开始解析','取消解析','启用','停用','删除'],t=>{let d=kbData(),s=kbCurrent().sets[d.set],action=()=>{if(t==='删除')s.files=s.files.filter((_,i)=>!d.selected.includes(i));else d.selected.forEach(i=>{let f=s.files[i];if(t==='启用'||t==='停用')f.enabled=t==='启用';else f.status=t==='开始解析'?'解析成功':'已取消';});d.selected=[];render();toast('批量'+t+'完成（Mock）');};if(t==='删除')kbConfirmDelete('所选文件',action);else action();});}
</script>
