.pipe{max-width:1040px}
.pipehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:4px 0 8px}
.seg{display:inline-flex;border:1px solid #dce3ed;border-radius:8px;overflow:hidden;background:#fff;vertical-align:middle}
.seg button{border:0;border-radius:0;background:#fff;padding:6px 16px}
.seg button.on{background:#e8f7ef;color:#178456;font-weight:600}
button.switchbtn{width:44px;height:26px;border:0;border-radius:13px;background:#d7dee7;padding:0;position:relative}
button.switchbtn.on{background:#2f9e6f}
button.switchbtn i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;display:block}
button.switchbtn.on i{left:21px}
.tag.pass{color:#178456;background:#e8f7ef}
.tag.send{color:#d4883a;background:#fff3e6}
.rulebox{border:1px solid var(--line);border-radius:10px;margin-top:10px}
.rulebox table{table-layout:fixed;width:100%}
.rulebox table,.rulebox td,.rulebox th{white-space:normal}
.rulebox td.ops,.rulebox td.act,.rulebox th.act,.rulebox td.name,.rulebox th.name{white-space:nowrap}
.rulebox th.act{width:12%}
.rulebox th.name{width:15%}
.rulebox th.code{width:18%}
.rulebox th.ops{width:18%}
.clip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.fit{table-layout:fixed;width:100%}
table.fit th,table.fit td{overflow:hidden;text-overflow:ellipsis}
table.fit .c0{width:36px}table.fit .c1{width:108px}table.fit .c2{width:84px}table.fit .c3{width:84px}table.fit .c6{width:132px}table.fit .c7{width:88px}table.fit .c8{width:64px}
.sessbar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sessbar .spacer{flex:1}
.prog{display:flex;margin:6px 0 16px}
.prog span{flex:1;text-align:center;padding:8px 4px;border-bottom:3px solid var(--line);color:#8a97a8;font-size:14px}
.prog span.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.prog span.done{border-color:#7dba93;color:#2f8f57}
.beat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;background:#fff}
.rulebox .boxhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.evrow{display:flex;gap:10px;align-items:center;margin:10px 0}
.evrow select{flex:1}
.evrow input[type=number]{width:88px}
.attrlock{background:#f7f9fb}
.attrlock select,.attrlock button{opacity:.5}
.pipe-error{color:#ce5b53;min-height:22px;margin:8px 0}
button.link.danger{color:#d36256}
.sumok{color:#178456}

function acLength(blocks){return blocks.reduce((sum,b)=>sum+(b.type==='table'?[...b.headers,...b.rows.flat()]:b.type==='list'?b.items:[b.text]).reduce((n,t)=>n+Array.from(t).length,0),0);}
function acInline(text){return esc(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function acRenderBlocks(blocks,limit=Infinity){let remaining=limit;function take(text){let chars=Array.from(text),count=Math.min(chars.length,Math.max(0,remaining));remaining-=count;return acInline(chars.slice(0,count).join(''));}let output='';for(let b of blocks){if(remaining<=0)break;if(b.type==='table'){let headers=b.headers.map(t=>take(t)),rows=[];for(let row of b.rows){if(remaining<=0)break;rows.push('<tr>'+row.map(cell=>'<td>'+take(cell)+'</td>').join('')+'</tr>');}output+=`<div class="ac-table-box"><table class="ac-table ${b.style||''}"><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}else if(b.type==='list'){let items=[];for(let t of b.items){if(remaining<=0)break;items.push('<li>'+take(t)+'</li>');}output+='<ul>'+items.join('')+'</ul>';}else output+=`<p>${take(b.text)}</p>`;}return output;}

const acAnalysisStorageKey='agentos.asset-agent-analysis.v1';
function acPlainBlocks(blocks,limit=Infinity){
 let remaining=limit,parts=[];
 const take=value=>{let chars=Array.from(String(value)),count=Math.min(chars.length,Math.max(0,remaining));remaining-=count;return chars.slice(0,count).join('').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1');};
 for(const block of blocks){if(remaining<=0)break;if(block.type==='table'){parts.push(block.headers.map(take).join(' | '));for(const row of block.rows){if(remaining<=0)break;parts.push(row.map(take).join(' | '));}}else if(block.type==='list'){for(const item of block.items){if(remaining<=0)break;parts.push('• '+take(item));}}else parts.push(take(block.text));}

}

function acDialogKey(event){if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeAssetChat();return;}if(event.key!=='Tab')return;let dialog=document.getElementById('asset-chat-dialog'),controls=Array.from(dialog.querySelectorAll('button:not([disabled]),textarea:not([disabled]),input:not([disabled])')).filter(n=>n.getClientRects().length);let first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
function acFeedbackRender(id){let m=acMessage(id),node=document.getElementById('ac-tools-'+id);if(m&&node)node.innerHTML=acFeedbackHtml(m);}
function acFeedbackFocus(id,index=0,text=false){let input=document.getElementById('ac-feedback-'+id),group=document.getElementById('ac-feedback-tags-'+id);if(text)input?.focus?.();else group?.querySelectorAll?.('button')?.[index]?.focus?.();document.getElementById('ac-feedback-form-'+id)?.scrollIntoView?.({block:'nearest'});}
function acFeedbackOpen(id,value){let m=acMessage(id);if(!m||m.status==='streaming'||!acFeedbackTagOptions[value])return;let prior=m.feedbackDraft?.value===value?m.feedbackDraft:m.feedback?.value===value?m.feedback:null,tags=(prior?.tags||[]).filter(tag=>acFeedbackTagOptions[value].includes(tag)),reason=prior?.reason||'';m.feedbackDraft={value,tags:[...tags],reason,expanded:prior?.expanded??!!(reason||tags.includes('其他'))};acFeedbackRender(id);acFeedbackFocus(id);}
function acFeedbackToggle(id,index){let m=acMessage(id),draft=m?.feedbackDraft;if(!draft)return;let tag=acFeedbackTagOptions[draft.value]?.[index];if(!tag)return;let tags=draft.tags||[],adding=!tags.includes(tag);draft.tags=adding?[...tags,tag]:tags.filter(t=>t!==tag);if(adding&&tag==='其他')draft.expanded=true;acFeedbackRender(id);acFeedbackFocus(id,index,adding&&tag==='其他');}
function acFeedbackCancel(id){let m=acMessage(id);if(!m)return;delete m.feedbackDraft;acFeedbackRender(id);}
function acFeedbackSave(id){let m=acMessage(id);if(!m?.feedbackDraft)return;let draft=m.feedbackDraft;m.feedback={value:draft.value,tags:acFeedbackTagOptions[draft.value].filter(tag=>draft.tags?.includes(tag)),reason:draft.reason.trim().slice(0,500),timestamp:new Date().toISOString()};delete m.feedbackDraft;acFeedbackRender(id);acPublishSession(acSession());}
function acFeedbackRemove(id){let m=acMessage(id);if(!m)return;m.feedback=null;delete m.feedbackDraft;acFeedbackRender(id);acPublishSession(acSession());}

let studioDrag=null,studioFocusBackup=null;
function beginStudioResize(e,left,right){if(e.button!==0)return;e.preventDefault();let l=document.getElementById('studio-panel-'+left),r=document.getElementById('studio-panel-'+right);studioDrag={left,right,x:e.clientX,l:l.getBoundingClientRect().width,r:r.getBoundingClientRect().width,sum:studio.weights[left]+studio.weights[right],grip:e.currentTarget};e.currentTarget.setPointerCapture?.(e.pointerId);e.currentTarget.classList.add('dragging');document.body.classList.add('studio-resizing')}
function applyStudioResize(delta){let d=studioDrag;if(!d)return;let total=d.l+d.r,min=Math.min(180,total*.25),pixels=Math.max(min,Math.min(total-min,d.l+delta));studio.weights[d.left]=d.sum*pixels/total;studio.weights[d.right]=d.sum-studio.weights[d.left];document.getElementById('studio-panel-'+d.left).style.flexGrow=studio.weights[d.left];document.getElementById('studio-panel-'+d.right).style.flexGrow=studio.weights[d.right];d.grip.setAttribute('aria-valuenow',Math.round(pixels/total*100))}
function endStudioResize(){if(studioDrag){studioDrag.grip.classList.remove('dragging');studioDrag=null;document.body.classList.remove('studio-resizing')}}
function keyboardStudioResize(e,left,right){if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();let l=document.getElementById('studio-panel-'+left),r=document.getElementById('studio-panel-'+right);studioDrag={left,right,l:l.getBoundingClientRect().width,r:r.getBoundingClientRect().width,sum:studio.weights[left]+studio.weights[right],grip:e.currentTarget};applyStudioResize(e.key==='ArrowRight'?24:-24);studioDrag=null}

let wtEvaluatorSerial=6;
function wtEvaluators(){return `<div class="wt-card-toolbar wt-evaluator-toolbar"><p>内置评估器可直接选用，也可创建自定义评估器。</p><button class="wt-dark" onclick="wtEditEvaluator()">＋ 创建评估器</button></div><div class="wt-evaluators">${wtEvaluatorsLibrary.map(e=>`<article class="wt-evaluator-card"><div class="wt-evaluator-tags">${wtChips([e.builtin?'平台内置':'自定义',e.type])}</div><h3>${esc(e.name)}</h3><p>${esc(e.description)}</p><footer>${wtLink('查看',`wtEditEvaluator('${e.id}',true)`)}<div>${!e.builtin?wtLink('编辑',`wtEditEvaluator('${e.id}')`):''} ${wtLink('使用',`wtEditStrategy('', '${e.id}')`)}</div></footer></article>`).join('')}</div>`;}
function wtEditEvaluator(id='',readonly=false){let e=wtEvaluatorsLibrary.find(x=>x.id===id);if(id&&!e)return;readonly=readonly||!!e?.builtin;let locked=readonly?'readonly':'';wtModal(readonly?'评估器详情':e?'编辑评估器':'创建评估器',wtField('名称',`<input name="name" maxlength="80" required ${locked} value="${esc(e?.name||'')}" placeholder="请输入评估器名称">`)+wtField('描述',`<textarea name="description" maxlength="1000" required ${locked} placeholder="描述评估目标和使用场景">${esc(e?.description||'')}</textarea>`)+wtField('类型',`<select name="type" ${readonly?'disabled':''} onchange="document.getElementById('wt-evaluator-prompt').classList.toggle('wt-code',this.value==='Code')">${wtOptions(['LLM','Code'],e?.type||'LLM')}</select>`)+`<label class="wt-prompt-label" for="wt-evaluator-prompt">提示词 <i>*</i></label><div class="wt-prompt-editor"><textarea id="wt-evaluator-prompt" class="${e?.type==='Code'?'wt-code':''}" name="prompt" required maxlength="20000" ${locked} spellcheck="false" oninput="document.getElementById('wt-evaluator-count').textContent=this.value.length+'/20000'">${esc(e?.prompt||wtEvaluatorPrompt)}</textarea><div class="wt-prompt-count" id="wt-evaluator-count">${(e?.prompt||wtEvaluatorPrompt).length}/20000</div></div><div class="wt-score-settings"><span class="wt-score-label">评分范围</span><div class="wt-score-range"><input type="number" step="any" name="scoreMin" aria-label="评分最小值" placeholder="请输入最小值" ${locked} value="${e?.scoreMin??''}"><span>−</span><input type="number" step="any" name="scoreMax" aria-label="评分最大值" placeholder="请输入最大值" ${locked} value="${e?.scoreMax??''}"></div><label class="wt-score-label wt-score-threshold">通过阈值 <small>大于等于该阈值为 Pass</small> <i>*</i><input type="number" step="any" name="passThreshold" aria-label="通过阈值" required ${locked} value="${e?.passThreshold??3}"></label></div><p id="wt-evaluator-error" class="wt-evaluator-error" role="alert"></p>`,readonly?`<button type="button" class="wt-dark" onclick="wtEditStrategy('', '${e.id}')">使用此评估器</button>`:'<button type="submit" class="wt-dark">保存</button>',`wtSaveEvaluator(this,'${id}')`);document.querySelector('.wt-modal')?.classList.add('wt-evaluator-modal');}
function wtSaveEvaluator(form,id=''){let e=wtEvaluatorsLibrary.find(x=>x.id===id);if(e?.builtin)return false;let fields=form.elements,values={name:fields.name.value.trim(),description:fields.description.value.trim(),type:fields.type.value,prompt:fields.prompt.value,scoreMin:fields.scoreMin.value.trim()===''?null:Number(fields.scoreMin.value),scoreMax:fields.scoreMax.value.trim()===''?null:Number(fields.scoreMax.value),passThreshold:fields.passThreshold.value.trim()===''?null:Number(fields.passThreshold.value)};let error=!values.name||!values.description||!values.prompt.trim()?'请填写名称、描述和提示词。':!['LLM','Code'].includes(values.type)?'请选择有效的评估器类型。':values.name.length>80||values.description.length>1000||values.prompt.length>20000?'输入内容超出长度限制。':wtEvaluatorsLibrary.some(x=>x.id!==id&&x.name===values.name)?'评估器名称已存在。':values.passThreshold===null||!Number.isFinite(values.passThreshold)?'请填写有效的通过阈值。':(values.scoreMin===null)!==(values.scoreMax===null)?'请完整填写评分范围的最小值和最大值。':values.scoreMin!==null&&(!Number.isFinite(values.scoreMin)||!Number.isFinite(values.scoreMax)||values.scoreMin>=values.scoreMax)?'评分范围需为有效数值，且最小值小于最大值。':values.scoreMin!==null&&(values.passThreshold<values.scoreMin||values.passThreshold>values.scoreMax)?'通过阈值必须在评分范围内。':'';if(error){document.getElementById('wt-evaluator-error').textContent=error;return false;}if(e)Object.assign(e,values);else wtEvaluatorsLibrary.push({id:'EV-'+String(++wtEvaluatorSerial).padStart(3,'0'),...values,builtin:false});dismiss();wtState.suite=null;wtTab('评估器');toast('评估器已保存');return true;}
function wtEvaluatorChoices(selected){return `<div class="wt-field"><span>评估器</span><div class="wt-evaluator-options">${wtEvaluatorsLibrary.map(e=>`<label class="wt-check"><input type="checkbox" name="evaluator" value="${e.id}" ${selected.includes(e.id)?'checked':''}> ${esc(e.name)} ${wtChips([e.type,e.builtin?'内置':'自定义'])}</label>`).join('')}</div></div>`;}

function wtScreen(){let d=wtData(),s=d.suites.find(s=>s.id===wtState.suite),tabs=s?['用例','报告','问题','优化']:['测试任务','用例集','策略','评估器'];return `${workbenchHeader()}<div class="wt-screen">${wtState.task?wtTaskResultPage(d,d.tasks.find(t=>t.id===wtState.task)):`<header class="wt-page-heading"><div class="wt-breadcrumb">测试 / ${d.name} 测试${s?' / '+esc(s.name):''}</div><h2>${s?wtLink('‹',"wtState.suite=null;wtState.page=1;render()"):'♧'} ${esc(s?s.name:d.name)} ${s?wtChips([s.version+'.0']):'<span class="wt-release">待发布</span><button class="wt-agent-select" aria-label="选择测试 Agent" onclick="openSceneSelector()">⌄</button>'}</h2></header><nav class="wt-tabs">${tabs.map(t=>`<button class="${(s?wtState.detailTab:wtState.tab)===t?'active':''}" onclick="${s?`wtState.detailTab='${t}';wtState.page=1;render()`:`wtTab('${t}')`}">${t}</button>`).join('')}</nav><div class="wt-content">${s?wtSuiteContent(d,s):wtState.tab==='测试任务'?wtTasks(d):wtState.tab==='用例集'?wtSuites(d):wtState.tab==='评估器'?wtEvaluators():wtStrategies(d)}</div>`}</div>`;}
function wtModal(title,body,footer='',formCode=''){document.getElementById('overlay').innerHTML=`<div class="backdrop wt-backdrop" onclick="if(event.target===this)dismiss()"><section class="wt-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><b>${esc(title)}</b><button aria-label="关闭" onclick="dismiss()">×</button></header><form id="wt-form" onsubmit="event.preventDefault();${formCode}"><div class="wt-modal-body">${body}</div><footer><button type="button" onclick="dismiss()">取消</button>${footer||'<button type="button" class="wt-dark" onclick="dismiss()">确定</button>'}</footer></form></section></div>`;}
function wtInfo(title,text){wtModal(title,`<p class="wt-info-text">${esc(text)}</p>`);}
function wtField(label,control,hint=''){return `<label class="wt-field"><span><i>*</i> ${label}</span>${control}${hint?`<small>${hint}</small>`:''}</label>`;}
function wtOptions(rows,selected='',empty=false){return (empty?'<option value="">请选择</option>':'')+rows.map(x=>`<option value="${esc(x.id||x)}" ${(x.id||x)===selected?'selected':''}>${esc(x.name||x)}</option>`).join('');}
function wtNewTask(){let d=wtData();wtModal('新建任务',wtField('Agent',`<select name="agent">${wtOptions([{id:d.scene,name:d.name}],d.scene)}</select>`)+wtField('Agent 版本',`<select name="version">${wtOptions(['Draft','V2','V1'],'Draft')}</select>`)+wtField('用例集',`<select name="suite" required>${wtOptions(d.suites,'',true)}</select>`)+wtField('执行并发数','<div class="wt-stepper"><button type="button" onclick="this.nextElementSibling.stepDown()">−</button><input name="concurrency" aria-label="执行并发数" type="number" min="1" max="10" value="2" required><button type="button" onclick="this.previousElementSibling.stepUp()">＋</button></div>','同一任务内可同时执行的用例数')+'<div class="wt-field"><span><i>*</i> 策略</span><div class="wt-radios"><label><input type="radio" name="strategyMode" value="history" checked onchange="wtToggleNewStrategy(false)"> 历史策略</label><label><input type="radio" name="strategyMode" value="new" onchange="wtToggleNewStrategy(true)"> 新建策略</label></div></div>'+`<div id="wt-history">${wtField('历史策略',`<select name="strategy" required>${wtOptions(d.strategies,'',true)}</select>`)}</div><div id="wt-new-strategy" hidden>${wtField('策略名称','<input name="strategyName" disabled>')}${wtField('测评模型',`<select name="model" disabled>${wtOptions(['deepseek-v4-flash','qwen3.7-max'])}</select>`)}</div>`,'<button type="submit" class="wt-dark">开始测试</button>',"wtSubmitTask(this)");}
function wtToggleNewStrategy(on){let old=document.getElementById('wt-history'),fresh=document.getElementById('wt-new-strategy');old.hidden=on;fresh.hidden=!on;old.querySelector('select').disabled=on;fresh.querySelectorAll('input,select').forEach(x=>{x.disabled=!on;x.required=on;});}
function wtSubmitTask(form){let f=new FormData(form),d=wtData(),strategy=f.get('strategy');if(f.get('strategyMode')==='new'){strategy=d.prefix+'-STR-'+Date.now();d.strategies.push({id:strategy,name:f.get('strategyName'),model:f.get('model'),metrics:['业务输出质量'],evaluators:['EV-001'],mcp:'—'});}wtCreateTask({suite:f.get('suite'),strategy,version:f.get('version'),concurrency:Number(f.get('concurrency'))});dismiss();wtState.suite=null;wtState.tab='测试任务';wtState.status='全部状态';wtState.range='全部时间范围';render();toast('已开始 Mock 测试');}
function wtCreateTask(params,scene=studio.scene){let d=wtCatalog[scene],suite=d.suites.find(x=>x.id===params.suite),strategy=d.strategies.find(x=>x.id===params.strategy);if(!suite||!strategy||!Number.isInteger(params.concurrency)||params.concurrency<1||params.concurrency>10)throw Error('测试任务参数无效');let t={id:d.prefix+'-TASK-'+String(++d.sequence).padStart(3,'0'),name:suite.name,suite:suite.id,strategy:strategy.id,version:params.version||'Draft',concurrency:params.concurrency,metrics:[...strategy.metrics],evaluators:(strategy.evaluators||['EV-001']).map(id=>wtEvaluatorsLibrary.find(e=>e.id===id)).filter(Boolean).map(e=>({...e})),status:'执行中',start:'2026-10-12 18:00',end:'—',mock:true};t.results=wtBuildResults(d,t);d.tasks.unshift(t);setTimeout(()=>wtCompleteTask(scene,t.id),900);return t;}
function wtCompleteTask(scene,id){let d=wtCatalog[scene],t=d.tasks.find(x=>x.id===id);if(!t||t.status!=='执行中')return;t.status='已完成';t.end='2026-10-12 18:01';t.results=wtBuildResults(d,t);let s=d.suites.find(x=>x.id===t.suite);s.reports.unshift({id:d.prefix+'-TR-'+t.id.split('-').pop(),task:t.id,score:0.94,tokens:19240,time:t.start,metrics:t.metrics,mock:true});if(studio.scene===scene&&wtState.open)render();}
function wtRerun(id){let d=wtData(),t=d.tasks.find(x=>x.id===id);wtCreateTask(t);render();toast('已创建新的 Mock 重跑任务');}

function wtTaskMore(id){let d=wtData(),t=d.tasks.find(x=>x.id===id);wtModal('任务操作',`<p>${esc(t.name)}</p><div class="wt-modal-actions">${wtLink('查看详情',`wtTaskDetail('${id}')`)}${wtLink('打开用例集',`dismiss();wtSuite('${t.suite}')`)}${wtLink('重跑任务',`dismiss();wtRerun('${id}')`)}</div>`);}
function wtCompare(id){let d=wtData(),t=d.tasks.find(x=>x.id===id),others=d.tasks.filter(x=>x.id!==id&&x.suite===t.suite);wtModal('任务比对',`<p>当前任务：${t.id}</p>${wtField('比对任务',`<select name="compare">${wtOptions(others.map(x=>({id:x.id,name:x.id+' · '+x.version+' · '+x.status})))}</select>`)}`,'<button type="submit" class="wt-dark">比对</button>',`wtCompareResult('${id}',this.elements.compare.value)`);}
function wtCompareResult(id,other){let d=wtData(),a=d.tasks.find(x=>x.id===id),b=d.tasks.find(x=>x.id===other);if(!b)return;wtModal('任务比对结果',`<table class="wt-table"><tr><th>指标</th><th>${a.id}</th><th>${b.id}</th></tr><tr><td>Agent版本</td><td>${a.version}</td><td>${b.version}</td></tr><tr><td>任务状态</td><td>${a.status}</td><td>${b.status}</td></tr><tr><td>执行并发数</td><td>${a.concurrency}</td><td>${b.concurrency}</td></tr></table><p class="wt-mock-note">以上为 Mock 任务配置与状态比对。</p>`);}
function wtEditSuite(id){let d=wtData(),s=d.suites.find(x=>x.id===id);wtModal(s?'编辑用例集':'新建用例集',wtField('用例集名称',`<input name="name" required value="${esc(s?.name||'')}">`)+wtField('描述',`<textarea name="description">${esc(s?.description||'')}</textarea>`),'<button type="submit" class="wt-dark">保存</button>',`wtSaveSuite(this,'${id||''}')`);}
function wtSaveSuite(form,id){let d=wtData(),s=d.suites.find(x=>x.id===id);if(s){s.name=form.elements.name.value;s.description=form.elements.description.value;}else d.suites.push({id:d.prefix+'-SET-'+Date.now(),name:form.elements.name.value,description:form.elements.description.value,version:'V1',updated:'2026-10-12 18:00',cases:[],reports:[],issues:[],opts:[]});dismiss();render();}
function wtStrategyDetail(id){let s=wtData().strategies.find(x=>x.id===id);wtModal('策略详情',`<dl class="wt-detail"><dt>策略编号</dt><dd>${s.id}</dd><dt>策略名称</dt><dd>${esc(s.name)}</dd><dt>测评内容</dt><dd>${wtChips(s.metrics)}</dd><dt>测评模型</dt><dd>${esc(s.model)}</dd><dt>选用 MCP</dt><dd>${esc(s.mcp)}</dd><dt>评估器</dt><dd>${wtChips((s.evaluators||['EV-001']).map(id=>wtEvaluatorsLibrary.find(e=>e.id===id)?.name||id))}</dd></dl>`);}
function wtEditStrategy(id, evaluatorId=''){let s=wtData().strategies.find(x=>x.id===id);wtModal(s?'编辑策略':'新建策略',wtField('策略名称',`<input name="name" required value="${esc(s?.name||'')}">`)+wtField('测评模型',`<select name="model">${wtOptions(['deepseek-v4-flash','deepseek-v4-pro','qwen3.7-max'],s?.model)}</select>`)+`<div class="wt-field"><span><i>*</i> 测评内容</span>${['业务输出质量','性能测试','token消耗测试'].map((x,i)=>`<label class="wt-check"><input type="checkbox" name="metric" value="${x}" ${(s?s.metrics.includes(x):i===0)?'checked':''}> ${x}</label>`).join('')}</div>`+wtEvaluatorChoices(evaluatorId?[evaluatorId]:(s?.evaluators||['EV-001'])),'<button type="submit" class="wt-dark">保存</button>',`wtSaveStrategy(this,'${id||''}')`);}
function wtSaveStrategy(form,id){let d=wtData(),f=new FormData(form),metrics=f.getAll('metric');if(!metrics.length){toast('请至少选择一项测评内容');return;}let s=d.strategies.find(x=>x.id===id),values={name:f.get('name'),model:f.get('model'),metrics,evaluators:f.getAll('evaluator').filter(id=>wtEvaluatorsLibrary.some(e=>e.id===id))};if(metrics.includes('业务输出质量')&&!values.evaluators.length){toast('请至少选择一个评估器');return;}if(s)Object.assign(s,values);else d.strategies.push({id:d.prefix+'-STR-'+Date.now(),...values,mcp:'—'});dismiss();render();}
function wtDeleteStrategy(id){let d=wtData();if(d.tasks.some(t=>t.strategy===id)){toast('策略已被测试任务引用，无法删除');return;}d.strategies=d.strategies.filter(x=>x.id!==id);render();}
function wtCurrentSuite(){return wtData().suites.find(x=>x.id===wtState.suite);}
function wtCaseDetail(id){let c=wtCurrentSuite().cases.find(x=>x.id===id);wtModal('用例详情',`<dl class="wt-detail"><dt>用例编号</dt><dd>${c.number}</dd><dt>预期输入</dt><dd>${esc(c.input)}</dd><dt>预期结果</dt><dd>${esc(c.expected)}</dd><dt>来源</dt><dd>${c.source}</dd><dt>AIOPS 标记描述</dt><dd>${esc(c.mark)}</dd></dl>`);}
function wtEditCase(id){let c=wtCurrentSuite().cases.find(x=>x.id===id);wtModal(c?'编辑用例':'新建用例',wtField('预期输入',`<textarea name="input" required>${esc(c?.input||'')}</textarea>`)+wtField('预期结果',`<textarea name="expected" required>${esc(c?.expected||'')}</textarea>`)+wtField('AIOPS 标记描述',`<input name="mark" value="${esc(c?.mark||'')}">`),'<button type="submit" class="wt-dark">保存</button>',`wtSaveCase(this,'${id||''}')`);}
function wtSaveCase(form,id){let s=wtCurrentSuite(),c=s.cases.find(x=>x.id===id),data={input:form.elements.input.value,expected:form.elements.expected.value,mark:form.elements.mark.value||'—'};if(c)Object.assign(c,data);else{let n=s.cases.length+1;s.cases.push({id:s.id+'-C'+n,number:'C'+String(n).padStart(2,'0'),...data,source:'手动添加'});}dismiss();render();}
function wtDeleteCase(id){wtCurrentSuite().cases.find(x=>x.id===id).deleted=true;render();toast('用例已移除，历史问题记录保留');}
function wtReport(id){let s=wtCurrentSuite(),r=s.reports.find(x=>x.id===id);wtModal('测试报告',`<dl class="wt-detail"><dt>报告编号</dt><dd>${r.id}</dd><dt>测试任务</dt><dd>${r.task}</dd><dt>用例集</dt><dd>${esc(s.name)}</dd><dt>业务输出质量</dt><dd>${r.score.toFixed(4)}</dd><dt>平均任务 Token</dt><dd>${r.tokens}</dd><dt>测试开始时间</dt><dd>${r.time}</dd></dl><p class="wt-mock-note">当前报告为 Mock 示例数据。</p>`);}
function wtIssue(id){let q=wtCurrentSuite().issues.find(x=>x.id===id);wtModal('问题详情',`<dl class="wt-detail"><dt>问题编号</dt><dd>${q.id}</dd><dt>测试用例</dt><dd>${q.caseId}</dd><dt>状态</dt><dd>${wtStatus(q.status)}</dd><dt>问题描述</dt><dd>${esc(q.description)}</dd><dt>优化推荐</dt><dd>${esc(q.recommendation)}</dd></dl>`);}
function wtRepair(id){let s=wtCurrentSuite(),q=s.issues.find(x=>x.id===id);q.status='处理中';if(!s.opts.some(o=>o.issue===id))s.opts.push({id:wtData().prefix+'-OPT-'+Date.now(),priority:'高',issue:id,description:q.description,fix:q.recommendation});render();wtModal('修复建议已生成',`<p class="wt-info-text">${esc(q.recommendation)}</p><p class="wt-mock-note">已生成 Mock 修复建议，可在“优化”页签查看。问题保持处理中，等待后续验证。</p>`);}

function ontConfirmDelete(kind,id){let d=ontData(),key=ontKindKey[kind];if(kind==='属性'){let o=d.objects.find(o=>o.id===ontUI().objectId);o.properties=o.properties.filter(p=>p.id!==id);if(ontUI().objectDraft)ontUI().objectDraft.properties=ontClone(o.properties);}else{d[key]=d[key].filter(r=>r.id!==id);if(kind==='对象'){d.relations=d.relations.filter(r=>r.from!==id&&r.to!==id);ontUI().filter='';}if(kind==='动作')d.rules.forEach(r=>r.executions=r.executions.filter(e=>e.action!==id));}dismiss();render();toast(kind+'已删除');}

function ontGraph(){let d=ontData(),u=ontUI(),coords={param_version:[155,630],allocation_task:[325,630],demand_side_wide:[500,660],demand_speed_config:[500,740],sales_order:[500,820],allocation_cycle_config:[500,940],package_split_config:[500,1020],inventory_config:[500,1100],supply_side_wide:[675,390],sales_speed:[675,510],target_wos:[850,435],blocklist_config:[850,350],demand_merged_wide:[675,590],inventory_merged_wide:[675,750],fallback_config:[850,925],fallback_guarantee:[850,660],priority_config:[675,1060],allocatable_supply:[850,520],participant_wide:[1025,520],non_participant_wide:[1200,300],waterfill_result:[1200,900],final_allocation_result:[1375,485],trade_identity:[1550,225],leftover_qty:[1550,485]};let panel=document.getElementById('studio-panel-gui'),graphHeight=Math.max(620,1720*Math.max(400,(panel?.clientHeight||1080)-190)/(panel?.clientWidth||1500));u.graphHeight=graphHeight;let graphObjects=d.objects.filter(o=>u.pending||o.status!=='草稿');let map=new Map(graphObjects.map((o,i)=>{let p=coords[o.id]||[160+(i%4)*370,220+Math.floor(i/4)*160];let pos=u.orientation==='横向'?p:[p[1]+130,p[0]*.67+120];return [o.id,[pos[0],90+(pos[1]-120)*(graphHeight-150)/1120]];}));let related=new Set([u.filter]);if(u.filter)d.relations.filter(r=>r.from===u.filter||r.to===u.filter).forEach(r=>{related.add(r.from);related.add(r.to);});return `<div class="ont-graph" id="ont-graph"><div class="ont-graph-tools">${ontSelect([['','选择对象'],...d.objects.map(o=>[o.id,o.name])],u.filter,'ontUI().filter=this.value;render()',false,'选择对象')}<label class="ont-graph-check"><input type="checkbox" ${u.pending?'checked':''} onchange="ontUI().pending=this.checked;render()">待确认</label><div class="ont-orientation">${['横向','纵向'].map(v=>`<button class="${u.orientation===v?'active':''}" onclick="ontUI().orientation='${v}';ontUI().zoom=1;ontUI().panX=0;ontUI().panY=0;render()">${v}</button>`).join('')}</div><div class="ont-graph-zoom">${[['plus','放大','ontZoom(1.2)'],['minus','缩小','ontZoom(0.83)'],['fit','适应画布','ontFit()'],['full','全屏','ontFullscreen()']].map(([icon,label,code])=>`<button aria-label="${label}" title="${label}" onclick="${code}">${ontGraphIcon(icon)}</button>`).join('')}</div></div><svg viewBox="0 0 1720 ${graphHeight}" role="group" aria-label="${esc(ontSetAsset().name)}对象集图谱" onpointerdown="ontPan(event)"><defs><filter id="ont-shadow"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-opacity=".12"/></filter></defs><g id="ont-graph-transform" transform="translate(${u.panX} ${u.panY}) translate(860 ${graphHeight/2}) scale(${u.zoom}) translate(-860 ${-graphHeight/2})">${d.relations.filter(r=>map.has(r.from)&&map.has(r.to)).map(r=>{let a=map.get(r.from),b=map.get(r.to),sx=a[0]+42,ex=b[0]-42,curve=Math.max(50,Math.abs(ex-sx)*.4),highlight=!u.filter||r.from===u.filter||r.to===u.filter,mx=(sx+ex)/2,my=(a[1]+b[1])/2;return `<g opacity="${highlight?1:.12}"><path d="M${sx} ${a[1]} C${sx+curve} ${a[1]} ${ex-curve} ${b[1]} ${ex} ${b[1]}" fill="none" stroke="#cbd2dc" stroke-width=".8"/><rect x="${mx-22}" y="${my-4}" width="44" height="8" rx="3" fill="white" stroke="#eef0f4" stroke-width=".5"/><text x="${mx}" y="${my+1.6}" font-size="3.5" text-anchor="middle" fill="#7f8b9b">${esc(r.name)}</text></g>`;}).join('')}${graphObjects.map((o,i)=>{let p=map.get(o.id);return `<g class="ont-graph-node" role="button" tabindex="0" aria-label="查看对象${esc(o.name)}" opacity="${!u.filter||related.has(o.id)?1:.2}" onclick="ontViewObject('${o.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ontViewObject('${o.id}')}"><rect x="${p[0]-42}" y="${p[1]-15}" width="84" height="30" rx="3" fill="#fdfdff" stroke="#d5dbe5" filter="url(#ont-shadow)"/><circle cx="${p[0]-30}" cy="${p[1]-7}" r="6" fill="#f0f3f8"/><text x="${p[0]-30}" y="${p[1]-5}" font-size="7" text-anchor="middle" fill="#7b8799">⊙</text><text x="${p[0]-19}" y="${p[1]-5}" font-size="4.8" fill="#4a576b" font-weight="600">${esc(o.name.length>10?o.name.slice(0,10)+'…':o.name)}</text><path d="M${p[0]-40} ${p[1]+4}h80" stroke="#eef0f4" stroke-width=".5"/><text x="${p[0]-35}" y="${p[1]+11}" font-size="3.8" fill="#929aaa">${o.properties.length} 属性　${ontObjectActions(o.id).length} 动作　${d.rules.filter(r=>r.object===o.id).length} 规则</text></g>`;}).join('')}</g></svg></div>`;}
function ontGraphTransform(){let u=ontUI(),g=document.getElementById('ont-graph-transform');if(g)g.setAttribute('transform',`translate(${u.panX} ${u.panY}) translate(860 ${(u.graphHeight||1240)/2}) scale(${u.zoom}) translate(-860 ${-(u.graphHeight||1240)/2})`);}

function ontFullscreen(){let g=document.getElementById('ont-graph');g?.classList.toggle('ont-graph-full');}
function ontPan(event){if(event.target.closest('.ont-graph-node')||event.button!==0)return;let svg=event.currentTarget,u=ontUI(),startX=event.clientX,startY=event.clientY,x=u.panX,y=u.panY;svg.setPointerCapture(event.pointerId);let move=e=>{let box=svg.getBoundingClientRect(),scale=Math.max(1720/box.width,(u.graphHeight||1240)/box.height);u.panX=x+(e.clientX-startX)*scale;u.panY=y+(e.clientY-startY)*scale;ontGraphTransform();},end=()=>{svg.removeEventListener('pointermove',move);svg.removeEventListener('pointerup',end);svg.removeEventListener('pointercancel',end);};svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);}
function ontScreen(){let u=ontUI(),d=ontData(),a=ontSetAsset(),o=d.objects.find(o=>o.id===u.objectId);if(u.objectId&&!o){u.objectId=null;u.objectDraft=null;}let tabs=o?[['概览',null],['属性',o.properties.length],['关系',d.relations.filter(r=>r.from===o.id||r.to===o.id).length],['动作',ontObjectActions(o.id).length],['规则',d.rules.filter(r=>r.object===o.id||r.triggerObject===o.id).length]]:[['对象集图谱',null],['对象',d.objects.length],['关系',d.relations.length],['规则',d.rules.length],['动作',d.actions.length]],tab=o?u.objectTab:u.tab;return `${workbenchHeader()}<section class="ont-screen"><div class="ont-crumb">首页 / <span>${esc(a.name)}${o?' / '+esc(o.name):''}</span></div><header class="ont-head"><button class="ont-back" aria-label="${o?'返回对象列表':'返回对象集'}" onclick="ontBack()">‹</button><h2>${esc(o?o.name:a.name)}</h2>${o?`<span class="ont-badge">对象 | ${esc(a.name)} ⌄</span>`:`<span class="ont-badge">对象集</span>${ontSelect(['草稿','已发布'],d.status,'ontData().status=this.value',false,'对象集状态').replace('<select ','<select class="ont-status-select" ')}<div class="ont-head-actions"><button class="ont-button" onclick="ontInstances()">实例管理</button><button class="ont-button" onclick="ontPreview()">预览调试</button><button class="ont-button" onclick="ontPublish()">发布</button></div>`}</header><nav class="ont-tabs" aria-label="${o?'对象详情':'对象集详情'}">${tabs.map(([name,count])=>`<button class="${tab===name?'active':''}" onclick="ontSelectTab('${name}')">${name}${count===null?'':`<span class="ont-count">${count}</span>`}</button>`).join('')}</nav>${!o&&tab==='对象集图谱'?ontGraph():`<div class="ont-body">${o&&tab==='概览'?ontOverview():ontList(o&&tab==='属性'?'属性':tab)}</div>`}</section>`;}

function ontOpenEditor(kind,id,readonly=false,nestedIndex=null){if(ontEditor&&nestedIndex!==null)ontEditorStack.push(ontEditor);else ontEditorStack=[];let record=id?ontRecord(kind,id):ontNewRecord(kind);if(!record)return;ontEditor={kind,id,readonly,draft:ontClone(nestedIndex!==null?ontEditorStack.at(-1).draft.executions[nestedIndex].custom||record:record),section:'basic',nestedIndex};ontRenderEditor();}

function ontEditorBasic(){let e=ontEditor,d=e.draft,kind=e.kind;return `<section class="ont-form-section" style="position:relative" id="ont-section-basic"><h3>基本信息</h3><div class="ont-grid">${ontDraftField('英文标识','id',true)}${ontDraftField('展示名称','name',true)}${kind==='规则'?ontDraftField('类型','type',true,['触发类','校验类'])+ontField('执行顺序',ontStepper('order'),true):''}${ontDraftField('描述','description',kind==='关系',null,true)}${kind==='规则'?ontField('回滚',ontSwitch(d.rollback,'ontEditor.draft.rollback=!ontEditor.draft.rollback','回滚',e.readonly)).replace('class="ont-field"','class="ont-field ont-rule-rollback"'):''}${kind==='对象'?ontDraftField('标签','tags'):''}</div></section>`;}

function ontRelationEditor(){let e=ontEditor,d=e.draft,options=ontData().objects.map(o=>[o.id,o.name+'（'+o.id+'）']);return ontEditorBasic()+`<section class="ont-form-section" id="ont-section-data"><h3>数据对象</h3><div class="ont-grid">${ontDraftField('源对象','from',true,options)}${ontDraftField('目标对象','to',true,options)}${ontDraftField('基数','cardinality',true,['1:N','N:1','1:1','N:N'])}${ontField('有向',ontSwitch(d.directed,'ontEditor.draft.directed=!ontEditor.draft.directed','有向',e.readonly))}</div></section>`;}

function ontCodeInput(node){ontEditor.draft.code=node.value;document.getElementById('ont-code-highlight').innerHTML=ontHighlight(node.value)+'\n';document.getElementById('ont-code-lines').textContent=node.value.split('\n').map((_,i)=>i+1).join('\n');node.style.width=Math.max(node.parentElement.clientWidth,...node.value.split('\n').map(line=>line.length*7.85+20))+'px';node.style.height=(node.value.split('\n').length*23+18)+'px';}

function ontActionEditor(){let e=ontEditor,d=e.draft;return ontEditorBasic()+`<section class="ont-form-section" id="ont-section-config"><h3>动作配置</h3><div class="ont-grid">${ontField('动作类型',ontSelect(['自定义函数','创建实例','更新实例','删除实例','创建关系'],d.type,'ontEditor.draft.type=this.value;ontRefreshEditor()',e.readonly,'动作类型'),true)}</div><div style="height:16px"></div>${d.type==='自定义函数'?`<div class="ont-config"><div class="ont-config-block"><h3>变量配置</h3>${ontVariableTable('variables')}</div><div class="ont-config-block"><h3>输出变量</h3>${ontVariableTable('outputs')}</div><div class="ont-config-block"><h3>函数配置</h3><div class="ont-grid">${ontDraftField('函数类型','language',false,['JavaScript','Python'])}<div></div>${ontField('函数',ontSelect([['','插入输入变量'],...d.variables.filter(v=>v.name).map(v=>[v.name,v.name])],'','ontInsertVariable(this.value);this.value=""',e.readonly,'插入输入变量'))}</div>${ontCodeEditor()}</div><div class="ont-config-block"><h3>错误处理 (error_handling)</h3><div class="ont-grid">${ontField('重试次数',ontStepper('retries'))}${ontDraftField('失败策略','failure',false,['跳过','中断','重试'])}</div></div></div>`:`<div class="ont-config"><div class="ont-grid">${ontDraftField(d.type==='创建关系'?'关系':'目标对象',d.type==='创建关系'?'relation':'object',true,d.type==='创建关系'?ontData().relations.map(r=>[r.id,r.name+'（'+r.id+'）']):ontData().objects.map(o=>[o.id,o.name+'（'+o.id+'）']))}</div><div style="height:20px"></div><h3>属性与参数配置</h3>${ontVariableTable('variables')}</div>`}</section>`;}
function ontConditionTable(group,index){let e=ontEditor;return `<div class="ont-condition"><header><b>条件组 ${index+1}</b>${e.readonly?'':ontLink('删除条件组',`ontEditor.draft.groups.splice(${index},1);ontRefreshEditor()`,true)}</header><div class="ont-table-scroll"><table class="ont-table"><thead><tr>${['数据路径类型','关系','属性','操作符','比较值','操作'].map((h,i)=>`<th>${[0,2,3,4].includes(i)?'<i class="ont-required">*</i> ':''}${h}</th>`).join('')}</tr></thead><tbody>${group.conditions.map((c,j)=>{let control=(key,options)=>{let code=`ontEditor.draft.groups[${index}].conditions[${j}].${key}=this.value`;return options?ontSelect(options,c[key],code,e.readonly):ontInput(c[key],code,e.readonly,'请输入');};return `<tr><td>${control('path',[['','请选择'],'当前对象','关联对象','动作输出'])}</td><td>${control('relation',[['','–'],...ontData().relations.map(r=>[r.id,r.name])])}</td><td>${control('property',[['{"from":{…','{"from":{…'],...ontPropertySeeds.map(p=>[p[0],p[1]])])}</td><td>${control('operator',['为空 (is_null)','不为空 (not_null)','等于 (eq)','不等于 (neq)','大于 (gt)','小于 (lt)'])}</td><td>${control('value')}</td><td>${e.readonly?'':ontLink('删除',`ontEditor.draft.groups[${index}].conditions.splice(${j},1);ontRefreshEditor()`,true)}</td></tr>`;}).join('')}</tbody></table></div>${e.readonly?'':`<div class="ont-add-row">${ontLink('＋ 新增条件',`ontAddCondition(${index})`)}</div>`}</div>`;}
function ontAddCondition(index){ontEditor.draft.groups[index].conditions.push({path:'',relation:'',property:'{"from":{…',operator:'为空 (is_null)',value:''});ontRefreshEditor();}
function ontExecutionCard(execution,index){let e=ontEditor,all=ontData().actions,a=all.find(a=>a.id===execution.action);return `<article class="ont-execution"><header><b>执行动作 ${index+1}</b><div>${ontLink('配置动作',`ontConfigureAction(${index})`)}${!e.readonly&&index>0?ontLink('↑ 上移',`ontMoveExecution(${index},-1)`):''}${!e.readonly&&index<e.draft.executions.length-1?ontLink('↓ 下移',`ontMoveExecution(${index},1)`):''}${e.readonly?'':ontLink('删除',`ontEditor.draft.executions.splice(${index},1);ontRefreshEditor()`,true)}</div></header><div class="ont-grid">${ontField('动作',ontSelect(all.map(a=>[a.id,a.name+'　['+a.type+']']),execution.action,`ontEditor.draft.executions[${index}].action=this.value;delete ontEditor.draft.executions[${index}].custom;ontRefreshEditor()`,e.readonly),true)}${ontField('错误处理',ontSelect(['中断，不执行后续动作','忽略错误，继续执行下一个动作（默认）'],execution.error,`ontEditor.draft.executions[${index}].error=this.value`,e.readonly))}</div><details><summary>在规则中定制动作${execution.customized?'<span class="ont-custom-tag">已定制</span>':''}</summary><div class="ont-mini-config"><p class="ont-message">为当前规则保存独立的动作配置。</p>${ontLink(e.readonly?'查看定制':'编辑定制',`ontConfigureAction(${index})`)}</div></details></article>`;}
function ontRuleEditor(){let e=ontEditor,d=e.draft;return ontEditorBasic()+`<section class="ont-form-section" id="ont-section-trigger"><h3>规则触发</h3><div class="ont-grid">${ontDraftField('触发方式','trigger',true,['事件触发','手动触发','定时触发'])}<div></div>${ontDraftField('事件类型','event',true,['指定对象的实例被创建','指定对象的实例被更新','指定对象的实例被删除'])}${ontDraftField('触发对象','triggerObject',true,ontData().objects.map(o=>[o.id,o.name+'（'+o.id+'）']))}</div></section><section class="ont-form-section" id="ont-section-conditions"><div class="ont-section-heading"><h3>动作触发</h3>${e.readonly?'':ontLink('＋ 新增条件组','ontEditor.draft.groups.push({conditions:[]});ontRefreshEditor()')}</div>${d.groups.map(ontConditionTable).join('')}</section><section class="ont-form-section" id="ont-section-executions"><div class="ont-section-heading"><h3>动作执行</h3>${e.readonly?'':ontLink('＋ 新增执行动作',`ontEditor.draft.executions.push({action:ontData().actions[0].id,error:'忽略错误，继续执行下一个动作（默认）',customized:false});ontRefreshEditor()`)}</div>${d.executions.map(ontExecutionCard).join('')}</section>`;}
function ontConfigureAction(index){let e=ontEditor,execution=e.draft.executions[index];ontOpenEditor('动作',execution.action,e.readonly,index);}
function ontMoveExecution(index,direction){let rows=ontEditor.draft.executions,other=index+direction;if(other<0||other>=rows.length)return;[rows[index],rows[other]]=[rows[other],rows[index]];ontRefreshEditor();}
function ontRefreshEditor(){let node=document.querySelector('.ont-drawer-scroll'),scroll=node?.scrollTop||0,section=ontEditor.section;ontRenderEditor();let next=document.querySelector('.ont-drawer-scroll');if(next)next.scrollTop=scroll;ontEditor.section=section;}
function ontRenderEditor(){let e=ontEditor,kind=e.kind,sections=ontSections(kind),title=(e.readonly?'查看':e.id?'编辑':'新建')+kind,body=kind==='属性'?ontAttributeEditor():kind==='关系'?ontRelationEditor():kind==='规则'?ontRuleEditor():kind==='动作'?ontActionEditor():ontEditorBasic();document.getElementById('overlay').innerHTML=`<div class="ont-backdrop" onclick="if(event.target===this)ontEditorClose()" onkeydown="if(event.key==='Escape'){event.stopPropagation();ontEditorClose()}"><section class="ont-drawer${kind==='属性'?' narrow':''}" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><div class="ont-head-actions"><button type="button" class="ont-button" onclick="ontEditorClose()">${e.readonly?'关闭':'取消'}</button>${e.readonly?'<button type="button" class="ont-button strong" onclick="ontEditorEdit()">编辑</button>':'<button type="button" class="ont-button strong" onclick="ontSaveEditor()">保存</button>'}<button type="button" class="ont-close" aria-label="关闭${title}" onclick="ontEditorClose()">×</button></div></header>${kind==='属性'?`<div class="ont-drawer-scroll">${body}<p class="ont-error" id="ont-editor-error"></p></div>`:`<div class="ont-drawer-layout"><nav class="ont-drawer-nav" aria-label="编辑分区">${sections.map(([id,name])=>`<button type="button" data-section="${id}" class="${e.section===id?'active':''}" onclick="ontNav('${id}')">${name}</button>`).join('')}</nav><div class="ont-drawer-scroll" onscroll="ontEditorScroll(this)">${body}<p class="ont-error" id="ont-editor-error"></p></div></div>`}</section></div>`;}
function ontSaveEditor(){let e=ontEditor,d=e.draft,error='';if(e.readonly)return;if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(d.id))error='英文标识请使用字母开头的字母、数字或下划线';else if(!d.name.trim())error='请输入展示名称';else if(d.id!==e.id&&ontRecord(e.kind,d.id))error='英文标识已存在';else if(e.kind==='关系'&&(!d.from||!d.to||!d.description.trim()))error='请填写描述、源对象和目标对象';else if(e.kind==='动作'&&d.type==='自定义函数'&&(!d.code.trim()||d.variables.some(v=>!v.name.trim())||d.outputs.some(v=>!v.name.trim())))error='请填写函数及变量名称';else if(e.kind==='规则'&&(!d.triggerObject||d.executions.some(x=>!ontData().actions.some(a=>a.id===x.action))))error='请选择触发对象与执行动作';if(error){document.getElementById('ont-editor-error').textContent=error;return;}d.name=d.name.trim();if(ontEditorStack.length){let parent=ontEditorStack.pop();parent.draft.executions[e.nestedIndex].custom=ontClone(d);parent.draft.executions[e.nestedIndex].customized=true;ontEditor=parent;ontRenderEditor();setTimeout(()=>ontNav('executions'),0);return;}let key=ontKindKey[e.kind],record=ontClone(d);record.updated='2026-10-20 15:00';if(e.kind==='属性'){let o=ontData().objects.find(o=>o.id===ontUI().objectId);if(e.id)Object.assign(o.properties.find(p=>p.id===e.id),record);else o.properties.push(record);if(ontUI().objectDraft)ontUI().objectDraft.properties=ontClone(o.properties);}else if(e.id)Object.assign(ontRecord(e.kind,e.id),record);else ontData()[key].push(record);let kind=e.kind;ontEditor=null;dismiss();render();toast(kind+'已保存');}

function openWorkshopAgents(){workbenchRegister('智能体');if(!waState.pinned)waState.weights={...studio.weights};waState.ontologyTab=waState.ontologyTab||woState.open;waState.open=true;waState.pinned=true;woState.open=false;wtState.open=false;studio.weights={docs:12,chat:30,gui:58};studio.panels.gui=true;studio.preview=null;render();}

function waWorkspaceTab(active){return `<span class="wt-workspace-tab ${active?'':'wa-inactive-tab'}"><button class="wa-tab-label" onclick="openWorkshopAgents()">✧ 智能体</button><button aria-label="关闭智能体" onclick="waClose()">×</button></span>`;}

function workshopHome(){workbenchData().active=null;waState.open=false;woState.open=false;wtState.open=false;studio.preview=null;studio.menu=false;dismiss();render();}
function waGet(id){return Object.values(waCatalog).flat().find(a=>a.id===id);}
function waDetail(id){let a=waGet(id);wtModal('智能体详情',`<dl class="wt-detail"><dt>智能体名称</dt><dd>${esc(a.name)}</dd><dt>说明</dt><dd>${esc(a.description||'–')}</dd><dt>所属场景</dt><dd>${studioSceneData[wiScene()].name}</dd><dt>智能体类型</dt><dd>${esc(a.type)}</dd><dt>状态</dt><dd>${a.status}</dd><dt>更新时间</dt><dd>${a.updated}</dd></dl><p class="wt-mock-note">当前为场景智能体的 Mock 草稿。</p>`,'<button type="button" class="wt-dark" onclick="waEdit(\''+id+'\')">编辑</button>');}
function waMore(id){wtModal('智能体操作',`<p>${esc(waGet(id).name)}</p><div class="wt-modal-actions">${wtLink('查看详情',`waDetail('${id}')`)}${wtLink('编辑智能体',`waEdit('${id}')`)}</div>`);}
function waEdit(id){let a=waGet(id);wtModal(a?'编辑智能体':'新建智能体',wtField('智能体名称',`<input name="name" required maxlength="60" value="${esc(a?.name||'')}">`)+wtField('智能体类型',`<select name="type">${wtOptions(['单智能体－自主规划','单智能体－工作流'],a?.type||'单智能体－自主规划')}</select>`)+wtField('说明',`<textarea name="description" maxlength="1000">${esc(a?.description||'')}</textarea>`),'<button type="submit" class="wt-dark">保存</button>',`waSave(this,'${id||''}')`);}
function waSave(form,id){let name=form.elements.name.value.trim();if(!name){toast('请输入智能体名称');return;}let a=waGet(id),values={name,description:form.elements.description.value.trim(),type:form.elements.type.value,updated:'2026-10-12 18:00'};if(a)Object.assign(a,values);else waCatalog[wiScene()].push({id:wiScene()+'-agent-'+Date.now(),...values,status:'待发布',updater:wiScene()==='sales'?'销售运营':'采购运营'});dismiss();render();}

function wiMenu(kind,id,button){let r=button.getBoundingClientRect(),left=Math.max(8,Math.min(r.right-150,window.innerWidth-160)),top=Math.min(r.bottom+6,window.innerHeight-160);document.getElementById('overlay').innerHTML=`<div class="wi-menu-layer" onclick="if(event.target===this)dismiss()"><div class="wi-card-menu" role="menu" aria-label="卡片操作" style="left:${left}px;top:${top}px"><button role="menuitem" onclick="dismiss();${kind==='agent'?`waEdit('${id}')`:`wiEditObject('${id}')`}">编辑</button><button role="menuitem" class="wi-delete" onclick="wiDelete('${kind}','${id}')">删除</button><button role="menuitem" onclick="dismiss();wiExport('${kind}','${id}')">导出</button></div></div>`;}

function wiSaveObject(form,id){let a=wiObject(id),name=form.elements.name.value.trim();if(!name){toast('请输入对象集名称');return;}let target=a.imported?wiImports[wiScene()].find(x=>x.id===id):assetOntologies.find(a=>a.agent===wiScene());target.name=name;target.description=form.elements.description.value.trim();dismiss();render();}

function scoresBody(c,s){let rows=fourScores(s),w=[35,20,25,20],total=scoreTotal(rows);let cards=rows.map((e,i)=>`<div class="card"><div class="row"><b>${e.name} · 权重 ${w[i]}%</b><span class="score ${e.v<0.6?'low':'high'}">${e.v.toFixed(2)}</span></div><p>${esc(e.note)}</p></div>`).join('');let hist=(c.history||[]).map(h=>`<div class="row"><b>${esc(h.runId||'')}</b><span>${Number(h.total).toFixed(2)}</span><span class="hint">采样记录</span></div>`).join('');return `${cards}<p>综合分 ${total.toFixed(2)} · 低于 0.60 进入这张表</p><h3>采样记录</h3><div class="card">${hist||'<p class="muted">无</p>'}</div><p class="hint">回测不会改写这些采样记录。</p>`}

function detailFoot(c){if(c.flow==='修改中')return '<span class="hint">正在自动修改</span>';let n=needsOf(c);if(c.flow==='已回测'){let extra='';if(n.fix)extra+=btn('去修复',`beginModify('${c.id}','fix')`);if(n.knowledge)extra+=btn('改知识',`beginModify('${c.id}','knowledge')`);return extra+btn('发起回测',`openRetest('${c.id}')`,true)}if(readyToRetest(c))return btn('发起回测',`openRetest('${c.id}')`,true);let parts=[];if(n.fix&&!c.fixReady)parts.push(btn('去修复',`beginModify('${c.id}','fix')`,true));if(n.knowledge&&!c.knowledgeFixed)parts.push(btn('改知识',`beginModify('${c.id}','knowledge')`,!n.fix||c.fixReady));return parts.join('')}
function detail(id,part){let alias={overview:'handle',conversation:'evidence',evaluation:'scores',history:'trace'};part=alias[part]||part||'handle';if(!['handle','evidence','scores','trace'].includes(part))part='handle';detailTab=part;let c=getCase(id),s=getSession(c);if(!c||!s)return;let tabs=[['handle','问题与处理'],['evidence','会话证据'],['scores','评估结果'],['trace','回测与历史']].map(([k,name])=>`<button class="${part===k?'active':''}" onclick="detail('${id}','${k}')">${name}</button>`).join('');let body=part==='evidence'?evidenceBody(c,s):part==='scores'?scoresBody(c,s):part==='trace'?traceBody(c):handleBody(c,s);shell('问题详情 '+c.id,`<div class="banner"><div><b>${c.sessionId}</b></div>${badge(flowOf(c))}</div><div class="v3tabs drawerTabs">${tabs}</div>${body}`,detailFoot(c))}
function beginModify(id,kind){let c=getCase(id);view='main';c.flow='修改中';c.modifyKind=kind;c.modifyBeat=1;log(c,kind==='fix'?'开始去修复':'开始改知识');render();detail(id,'handle');timers.push(setTimeout(()=>tickModify(id),800))}
function tickModify(id){let c=getCase(id);if(!c||c.flow!=='修改中')return;if(c.modifyBeat<2){c.modifyBeat++;detail(id,'handle');timers.push(setTimeout(()=>tickModify(id),800));return}c.modifyBeat=3;finishModify(c);render();detail(id,'handle')}
function finishModify(c){if(c.modifyKind==='knowledge'){c.knowledgeText=knowledgeAfter(c);c.knowledgeFixed=true;log(c,'已改写知识')}else{c.draft={id:'DRAFT-'+c.id,type:c.types.includes('本体错误')?'本体':'Skill',version:'v2.5',summary:fixSummary(c),ready:true};c.fixReady=true;log(c,'已生成 '+c.draft.type+' 草稿 '+c.draft.version)}c.flow=readyToRetest(c)?'待回测':'待处理';log(c,c.flow==='待回测'?'修改完成，可以发起回测':'这一处已完成，还需要改另一处')}
function openRetest(id){let c=getCase(id);if(!readyToRetest(c)){toast('请先完成修改');return}let fixes='';if(c.fixReady&&c.draft)fixes+=`<label class="checkline"><input type="checkbox" checked disabled> <span><b>${esc(c.draft.type)} 草稿 ${esc(c.draft.version)}</b><br><span class="hint">用于重跑会话，不发布。</span></span></label>`;if(c.knowledgeFixed){let a=attributions(c).find(x=>x.kind==='knowledge');fixes+=`<label class="checkline"><input type="checkbox" checked disabled> <span><b>${esc(a?a.object:'知识')}</b><br><span class="hint">${esc(c.knowledgeText)}</span></span></label>`}let others=cases.filter(x=>x.id!==c.id).map(o=>`<label class="checkline"><input class="retsample" type="checkbox" value="${o.id}"> <span><b>${o.sessionId}</b> ${esc(o.title)}</span></label>`).join('');shell('发起回测 · '+c.id,`<h3>1. 修复对象</h3>${fixes}<h3>2. 回测样本</h3><label class="checkline"><input type="checkbox" checked disabled> <span><b>${c.sessionId}</b> ${esc(c.title)}<br><span class="hint">原问题会话，必选</span></span></label><p class="hint">同一批里前后出现的其他问题可以一起勾选。和这次修改同类的记为通过，其余保持原分数。</p>${others}`,`${btn('取消','dismiss()')}${btn('开始回测',`runRetest('${c.id}')`,true)}`,true)}
function runRetest(id){let c=getCase(id);if(!readyToRetest(c)){toast('请先完成修改');return}let extra=Array.from(document.querySelectorAll('.retsample')).filter(n=>n.checked).map(n=>n.value);let ids=[c.id].concat(extra.filter(x=>x!==c.id));let detailSamples=ids.map(cid=>{let cc=getCase(cid),ss=getSession(cc),before=fourScores(ss),pass=cid===c.id||cc.types.some(t=>c.types.includes(t));let after=pass?before.map(e=>({name:e.name,v:.91,note:'修复后符合标准'})):before.map(e=>({name:e.name,v:e.v,note:e.note}));return {sessionId:cc.sessionId,title:cc.title,before,after,beforeTotal:scoreTotal(before),afterTotal:scoreTotal(after),pass,origin:cid===c.id}});let origin=detailSamples[0];let rec={id:'RET-'+String(++retSerial).padStart(3,'0'),caseId:c.id,status:'完成',samples:detailSamples.map(x=>x.sessionId),object:repairObject(c),time:'2026-10-09 17:30',pass:origin.pass,results:detailSamples.map(x=>({sid:x.sessionId,original:x.beforeTotal,total:x.afterTotal,scores:x.after.slice(0,3).map(e=>e.v),pass:x.pass,answer:'已按修改重跑',reason:x.pass?'原问题未再出现':'这次修改没有覆盖这条问题'})),detailSamples};retests.unshift(rec);c.retestView=rec;c.flow=origin.pass?'已回测':'待处理';log(c,rec.id+'完成：'+detailSamples.filter(x=>x.pass).length+'/'+detailSamples.length+' 条通过');render();showFlowResult(rec.id)}
function showFlowResult(id){let r=retests.find(x=>x.id===id);if(!r)return;let c=getCase(r.caseId);if(!r.detailSamples){let rows=(r.results||[]).map(x=>`<div class="card"><b>${esc(x.sid)}</b><p>${Number(x.original).toFixed(2)} → ${Number(x.total).toFixed(2)}</p>${badge(x.pass?'通过':'未通过')}</div>`).join('');shell('回测结果 · '+r.id,`<p>${esc(r.object||'')}</p>${rows}<p class="hint">历史采样记录没有改动。</p>`,btn('返回详情',`detail('${c.id}','trace')`));return}let blocks=r.detailSamples.map(s=>`<div class="card"><div class="row"><b>${s.sessionId}</b> ${esc(s.title)} ${badge(s.pass?'通过':'未通过')}</div><p>综合分 ${s.beforeTotal.toFixed(2)} → <b>${s.afterTotal.toFixed(2)}</b></p>${scoreTable(s)}</div>`).join('');shell('回测结果 · '+r.id,`<p>使用 ${esc(r.object)} 重跑 ${r.detailSamples.length} 条会话。</p>${blocks}<p class="hint">${r.pass?'原会话已通过，状态变为已回测。':'原会话未通过，状态回到待处理，可以再改再测。'}历史采样记录没有改动。</p>`,btn('返回详情',`detail('${c.id}','trace')`))}
function reviewCase(id,action){let c=getCase(id);c.review=action==='undo'?'待复核':'已确认';log(c,action==='undo'?'撤销误报，重新进入复核':'人工确认问题');detail(id);render();toast('复核状态已更新')}function saveNote(id){let c=getCase(id);c.note=document.getElementById('note').value;log(c,'保存处理备注');toast('备注已保存')}function misreport(id){shell('标记误报','<div class="notice">将停止当前问题的处理，保留原评分和历史；可以撤销。</div><label class="field">误报原因<textarea id="falseReason" placeholder="请说明为何判断为误报"></textarea></label><p id="reviewError" role="alert"></p>',`${btn('取消',`detail('${id}')`)}${btn('确认误报',`markFalse('${id}')`,true)}`,true)}function markFalse(id){let reason=document.getElementById('falseReason').value.trim();if(!reason){document.getElementById('reviewError').textContent='请填写误报原因。';return}let c=getCase(id);c.review='误报';c.reviewReason=reason;log(c,'标记误报：'+reason);render();detail(id)}
function standard(i,id='',config=false){let e=EVALS[i];shell(e.name+' · 评分标准',`<div class="banner"><span>预置评估器 · 大模型类型</span><span class="tag">Session</span></div><h3>评估内容</h3><p>${e.desc}</p><div class="divider"></div><h3>分数含义</h3><div class="card"><b>0.80～1.00</b>　充分符合标准<br><b>0.60～0.79</b>　基本符合，存在轻微不足<br><b>0.00～0.59</b>　存在明显缺陷，需要检查证据</div><h3>关键问题</h3><p>${e.critical}</p><div class="divider"></div><h3>输出要求</h3><p>得分、理由、问题轮次、证据和问题类型。无证据时不直接认定关键知识错误。</p><p class="hint">评估器创建、提示词编辑和版本管理暂缓。</p>`,btn('返回',config?'showConfigStep()':id?`detail('${id}','evaluation')`:'dismiss()'))}
function knowledge(id){let c=getCase(id),s=getSession(c),ks=c.types.filter(t=>t.startsWith('知识'));shell('知识修正 · '+c.id,`<div class="notice">只修正当前问题关联的知识，不进入全库管理。保存为待回测草稿。</div><form id="knowledgeForm">${ks.map((t,i)=>`<div class="card"><span class="tag orange">${t}</span><h3>${t==='知识错误'?'K-018 · 差旅报销标准':esc(s.knowledgeTheme)}</h3><p class="id">${t==='知识错误'?'当前版本 v1 · 关联知识 ID：K-018':'无现成知识 ID · 待补充主题'}</p><div class="message"><b>原内容／问题证据</b><p>${t==='知识错误'?'上海住宿报销上限为每晚500元。':esc(s.evidence)}</p></div><div class="field"><label for="knowledge${i}">${t==='知识错误'?'修正后内容':'补充知识内容'}</label><textarea id="knowledge${i}" placeholder="填写可用于回测的业务规则">${esc(c.knowledgeEdits[i]?.content||'')}</textarea></div></div>`).join('')}<p class="hint">原会话：${s.user}。保存知识修正不代表知识已发布。</p><p id="knowledgeError" role="alert"></p></form>`,`${btn('取消',`detail('${id}')`)}${btn('保存修正草稿',`saveKnowledge('${id}')`,true)}`)}function saveKnowledge(id){let c=getCase(id),ks=c.types.filter(t=>t.startsWith('知识')),values=ks.map((t,i)=>document.getElementById('knowledge'+i).value.trim());if(values.some(v=>!v)){document.getElementById('knowledgeError').textContent='请为每项知识问题填写修正或补充内容。';return}c.knowledgeEdits=values.map((content,i)=>({type:ks[i],content,id:ks[i]==='知识错误'?'K-018':'K-DRAFT-'+c.id}));c.knowledgeDraft={id:'KD-'+c.id,summary:values.join('；'),ready:true};c.status='待回测';log(c,'保存知识修正草稿 v2，尚未发布');render();detail(id);toast('知识修正已保存，可发起回测')}
function repair(id){let c=getCase(id);dismiss();repairing=id;view='repair';c.status='处理中';log(c,'打开打造态新会话，传入 Session 和问题分析');render()}function renderRepair(){let c=getCase(repairing),s=getSession(c),kind=c.types.includes('本体错误')?'本体':'Agent';document.getElementById('app').innerHTML=`<div class="pagehead"><div><h1>打造态 · 问题修复</h1><p class="muted">${c.id} / 新会话</p></div>${btn('返回问题详情',`view='main';render();detail('${c.id}')`)}</div><div class="stage"><span>理需求</span><span>挖知识</span><span>建本体</span><span>生智能</span><b>问题修复会话</b></div><div class="workview"><div class="workleft"><b>相关上下文</b><div class="card">${c.sessionId}<p class="id">原始会话</p></div><div class="card">${c.id}<p class="id">问题分析与证据</p></div><b>交付物</b><div class="card">${c.draft?kind+' 草稿 '+c.draft.version:'等待修复草稿'}</div></div><div class="chat"><div class="message user"><b>带入的修复请求</b><p>版本 ${s.version}</p><p>用户：${esc(s.user)}</p><p>原回答：${esc(s.answer)}</p><p>问题分析：${esc(s.evidence)}</p><p>首次入池：${esc(c.evaluation.reason)}</p></div><div class="message"><b>调用已有的问题识别与修复 Skill</b><p>分析上下文并生成${kind}修复草稿。此会话不重新走一遍需求创建流程。</p><span class="hint">已有 Skill 的名称与执行接口使用占位，等待接入。</span></div>${c.draft?`<div class="card"><span class="tag green">草稿已生成</span><h3>${kind} · ${c.draft.version}</h3><p>${esc(c.draft.summary)}</p><p class="hint">${c.draft.id} · 仅用于回测，未替换线上版本</p></div>${c.types.some(t=>t.startsWith('知识'))&&!c.knowledgeDraft?'<div class="notice">同时存在知识问题，还需要保存知识修正。</div>':''}${btn('使用草稿回测',`retest('${c.id}')`,true)}`:btn('运行修复 Skill',`generateDraft('${c.id}')`,true)}</div><div class="workright"><b>资产</b><div class="divider"></div><p>本体</p><p>智能体</p><p>技能</p><p>MCP</p><p>知识库</p><p>测试</p></div></div>`}function generateDraft(id){shell('正在生成修复草稿','<div class="progress"><i style="width:60%"></i></div><p>读取问题证据，执行已有修复 Skill…</p>');timers.push(setTimeout(()=>{let c=getCase(id);c.draft={id:'DRAFT-'+c.id,type:c.types.includes('本体错误')?'本体':'Agent',version:'v2',summary:c.types.includes('本体错误')?'修正供应商主体关系和映射约束。':c.types.includes('回答质 function retest(id){let c=getCase(id),s=getSession(c),others=sessions.filter(x=>x.agent===c.agent&&x.id!==s.id).slice(0,6);shell('发起回测 · '+c.id,`<div class="section"><h3>1 · 修复对象</h3><div class="card">${c.draft?`<label class="checkline"><input id="useDraft" type="checkbox" checked>${c.draft.type}修复草稿 ${c.draft.version} · ${c.draft.id}</label>`:''}${c.knowledgeDraft?`<label class="checkline"><input id="useKnowledge" type="checkbox" checked>知识修正草稿 v2 · ${c.knowledgeDraft.id}</label>`:''}<p class="hint">选中的草稿用于重放会话，不发布线上版本。</p></div></div><h3>2 · 回测样本</h3><div class="card"><label class="checkline"><input type="checkbox" checked disabled>${s.id} · 原问题会话（必选）</label></div><p class="hint">可追加其他会话，检查修复是否影响其他场景。</p>${others.map(x=>`<label class="checkline sample"><input class="sampleChoice" type="checkbox" value="${x.id}"><div><b>${x.id}</b> · ${esc(x.title)}<div class="id">${x.time}</div></div></label>`).join('')}<div class="section"><h3>3 · 沿用原评估规则</h3><div class="notice">阈值 ${c.evaluation.threshold} · 权重 ${c.evaluation.weights.join('% / ')}% · 关键问题兜底。使用新草稿重新运行会话后评分。</div><label class="field">演示执行分支<select id="testOutcome"><option value="normal">按修复内容验证</option><option value="regression">模拟修复未通过</option><option value="error">模拟执行失败</option></select></label></div><p id="testError" role="alert"></p>`,`${btn('取消',`detail('${id}')`)}${btn('开始回测',`executeRetest('${id}')`,true)}`)}
function executeRetest(id){let c=getCase(id),useDraft=!!document.getElementById('useDraft')?.checked,useKnowledge=!!document.getElementById('useKnowledge')?.checked,outcome=document.getElementById('testOutcome').value;if(!useDraft&&!useKnowledge){document.getElementById('testError').textContent='请至少选择一个修复对象。';return}let chosen=[c.sessionId,...Array.from(document.querySelectorAll('.sampleChoice:checked')).map(x=>x.value)];let r={id:'RET-'+String(++retSerial).padStart(3,'0'),caseId:id,status:'执行中',samples:chosen,object:[useDraft?c.draft.type+'草稿 '+c.draft.version:'',useKnowledge?'知识修正 v2':''].filter(Boolean).join(' ＋ '),time:'2026-10-09 17:30',useDraft,useKnowledge,outcome,results:[]};retests.unshift(r);showRetestProgress(r);timers.push(setTimeout(()=>{if(outcome==='error'){r.status='失败';r.error='会话重放服务超时，未产生质量结论。';log(c,r.id+'执行失败，保留原问题状态');result(r.id);return}r.results=chosen.map(sid=>{let s=sessions.find(s=>s.id===sid),original=avg(s.scores,c.evaluation.weights),isOriginal=sid===c.sessionId,needsGeneral=c.types.some(t=>!t.startsWith('知识')),needsKnowledge=c.types.some(t=>t.startsWith('知识')),canFix=!isOriginal||((!needsGeneral||useDraft)&&(!needsKnowledge||useKnowledge));let scores=canFix&&outcome!=='regression'?[.94,.92,.88]:[...s.scores],critical=canFix&&outcome!=='regression'?false:s.critical;if(!isOriginal&&s.types.some(t=>t.startsWith('知识'))&&!useKnowledge){scores=[...s.scores];critical=s.critical}if(!isOriginal&&s.types.some(t=>!t.startsWith('知识'))&&!useDraft){scores=[...s.scores];critical=s.critical}let total=avg(scores,c.evaluation.weights),bad=total<c.evaluation.threshold||critical;return {sid,original,total,scores,pass:!bad,answer:bad?s.answer:(isOriginal&&useKnowledge?c.knowledgeDraft.summary:'已使用修复后的规则重新完成任务，输出所需结果。'),reason:bad?'所选修复对象尚未消除全部问题':'未再次命中原问题，评估通过'};});r.status='完成';r.pass=r.results.every(x=>x.pass);c.status=r.pass?'待确认':'待处理';log(c,r.id+'完成：'+(r.pass?'所选样本通过，等待人工确认':'存在未通过样本，继续处理'));render();result(r.id)},1000))}
function showRetestProgress(r){shell('回测执行中 · '+r.id,`<div class="notice">对象：${esc(r.object)}</div><div class="progress"><i style="width:55%"></i></div><p>重放 ${r.samples.length} 条会话，使用原评估规则评分…</p>`)}function result(id){let r=retests.find(r=>r.id===id),c=getCase(r.caseId);if(r.status==='执行中'){showRetestProgress(r);return}if(r.status==='失败'){shell('回测失败 · '+r.id,`<div class="notice">${r.error}</div><p>执行失败不代表质量未通过，原问题状态保持不变。</p>`,`${btn('返回详情',`detail('${c.id}','history')`)}${btn('重新回测',`retest('${c.id}')`,true)}`);return}let original=r.results.find(x=>x.sid===c.sessionId);shell('回测结果 · '+r.id,`<div class="banner"><b>${r.object}</b>${badge(r.pass?'通过':'未通过')}</div><div class="grid2"><div class="card"><span class="muted">原问题会话 · 原始综合分</span><strong class="bigscore">${original.original.toFixed(2)}</strong></div><div class="card"><span class="muted">重新运行后 · 综合分</span><strong class="bigscore ${original.pass?'high':'low'}">${original.total.toFixed(2)}</strong></div></div><table><thead><tr><th>维度</th><th>原始得分</th><th>回测得分</th></tr></thead><tbody>${EVALS.map((e,i)=>`<tr><td>${e.name}</td><td>${c.evaluation.weights[i]?getSession(c).scores[i].toFixed(2):'未启用'}</td><td>${c.evaluation.weights[i]?original.scores[i].toFixed(2):'未启用'}</td></tr>`).join('')}</tbody></table><div class="card"><b>重新运行后的回答</b><p>${esc(original.answer)}</p><p class="hint">${original.reason}</p></div><h3>全部回测样本</h3>${r.results.map(x=>`<div class="historyrow"><b>${x.sid}</b><span>${x.original.toFixed(2)} → ${x.total.toFixed(2)}</span>${badge(x.pass?'通过':'未通过')}</div>`).join('')}<div class="notice">${r.pass?'全部所选样本通过，可人工确认解决。':'至少一条样本未通过，需要继续处理。'}原始结果与此次回测记录分别保存。</div>`,`${btn('返回详情',`detail('${c.id}','history')`)}${r.pass?btn('确认已解决',`resolveCase('${c.id}')`,true,c.status==='已解决'):btn('继续处理',`detail('${c.id}')`,true)}`)}function resolveCase(id){let c=getCase(id);c.status='已解决';c.review='已确认';log(c,'人工确认：问题已解决');dismiss();view='main';render();toast('已解决，评分与回测历史保留')}
function runConfig(id){let cfg=configs.find(c=>c.id===id);if(runs.some(r=>r.cfgId===id&&r.status==='执行中'))return;let snapshot=JSON.parse(JSON.stringify(cfg)),collected=collect(snapshot),r={id:'RUN-'+String(++serial).padStart(3,'0'),cfgId:id,name:cfg.name,agent:cfg.agent,time:'2026-10-09 17:30',status:'执行中',snapshot,eligible:scopeSessions(snapshot).length,items:collected.map(x=>({...x,stage:x.excluded?'已排除':'等待评估',evaluation:null})),newCount:0};runs.unshift(r);cfg.last=r.time;render();showRun(r.id);timers.push(setTimeout(()=>{for(let x of r.items){if(x.excluded)continue;x.evaluation=evaluateSession(x.s,snapshot);x.stage='评估完成';if(x.evaluation.bad){if(attachCase(x.s,r,x.evaluation))r.newCount++}}r.status='完成';render();if(document.getElementById('runMarker')?.value===r.id)showRun(r.id);toast('运行完成，已关联本次问题会话');},1000))}
function runHistory(cfgId=''){let list=runs.filter(r=>!cfgId||r.cfgId===cfgId);shell(cfgId?'运行记录 · '+esc(configs.find(c=>c.id===cfgId).name):'全部采样运行记录',`<p class="hint">每次运行保存配置版本、采集范围、评估规则与会话结果。</p>${list.map(r=>`<div class="card"><div class="row space"><div><b>${r.id}</b><span class="id"> · ${r.time}</span><p>${esc(r.name)}</p></div>${badge(r.status)}${btn('查看明细',`showRun('${r.id}')`)}</div><div class="hint">配置 v${r.snapshot.revision} · 抽样 ${r.items.length} · 初筛保留 ${r.items.filter(x=>!x.excluded).length} · 失败 ${r.items.filter(x=>x.stage==='评估失败').length}</div></div>`).join('')||'<div class="empty">尚无运行记录</div>'}`)}
function showRun(id,part='summary'){let r=runs.find(x=>x.id===id),retained=r.items.filter(x=>!x.excluded),success=r.items.filter(x=>x.stage==='评估完成'),failed=r.items.filter(x=>x.stage==='评估失败'),bad=success.filter(x=>x.evaluation.bad),caseIds=bad.map(x=>cases.find(c=>c.sessionId===x.s.id)?.id).filter(Boolean);let range=r.items.map(x=>x.s.time).sort();let body=`<input type="hidden" id="runMarker" value="${r.id}"><div class="banner"><b>${r.id} · 配置 v${r.snapshot.revision}</b>${badge(r.status)}</div><p>${esc(r.name)}</p><p class="hint">实际会话范围：${range.length?range[0]+' 至 '+range[range.length-1]:'无匹配会话'}<br>阈值 ${r.snapshot.threshold} · 权重 ${r.snapshot.weights.join('% / ')}% · ${r.snapshot.method}</p><div class="v3tabs drawerTabs"><button class="${part==='summary'?'active':''}" onclick="showRun('${id}')">运行概况</button><button class="${part==='samples'?'active':''}" onclick="showRun('${id}','samples')">会话明细 ${r.items.length}</button></div>`;if(part==='summary')body+=`<div class="steps"><div class="step">符合条件<strong>${r.eligible}</strong></div><div class="step">抽样<strong>${r.items.length}</strong></div><div class="step">初筛保留<strong>${retained.length}</strong></div></div>${r.status==='执行中'?'<div class="progress"><i style="width:55%"></i></div><p>正在评分…</p>':`<div class="steps"><div class="step">评估成功<strong>${success.length}</strong></div><div class="step">评估失败<strong>${failed.length}</strong></div><div class="step">命中问题<strong>${bad.length}</strong></div></div><div class="notice">新增 ${r.newCount} 条 Badcase；已存在 ${bad.length-r.newCount} 条追加评估历史。评分通过 ${success.length-bad.length} 条；初筛排除 ${r.items.length-retained.length} 条。</div>${failed.length?`<div class="card"><b>失败原因</b><p>评估模型请求超时，无评分结论。</p>${btn('重试失败会话',`retryRun('${id}')`)}</div>`:''}<h3>关联问题会话</h3>${caseIds.map(cid=>`<div class="historyrow"><span>${cid}</span><span>${esc(getCase(cid).title)}</span>${btn('查看',`detail('${cid}')`)}</div>`).join('')||'<div class="card muted">本次没有产生问题会话。</div>'}`}`;if(part==='samples')body+=`<tab function retryRun(id){let r=runs.find(x=>x.id===id);for(let x of r.items.filter(x=>x.stage==='评估失败')){x.stage='评估完成';x.evaluation=evaluateSession(x.s,r.snapshot);if(x.evaluation.bad&&attachCase(x.s,r,x.evaluation))r.newCount++}r.status='完成';render();showRun(id);toast('已重试失败会话，使用原配置快照')}

function kbFiles(a){let d=kbData(),s=a.sets[d.set]||a.sets[0],files=s?.files||[];return `<div class="kb-files"><aside class="kb-side">${kbSearchControl('',"kbFilterTree(this.value)")}<div class="kb-side-heading"><b>所有文件</b><button class="kb-link" onclick="kbEditSet()">＋ 新建文件集</button></div><div id="kb-tree">${a.sets.map((set,i)=>`<details open><summary class="kb-tree-row"><span>◇</span><button onclick="kbData().set=${i};kbData().folder='';render()">${esc(set.name)}</button></summary><div class="kb-tree-children">${set.folders.map(f=>`<div class="kb-tree-row ${d.set===i&&d.folder===f?'selected':''}"><span>▸</span><button onclick="kbData().set=${i};kbData().folder='${esc(f)}';kbData().selected=[];render()">▱ ${esc(f)}</button><button class="kb-more" aria-label="${esc(f)}文件夹更多" onclick="kbFolderMenu(${i},'${esc(f)}',this)">···</button></div>`).join('')}</div></details>`).join('')}</div></aside><section class="kb-box ${a.sets.length?'kb-table-box':'kb-empty'}">${!a.sets.length?'暂无文件':`<div class="kb-file-tools"><button ${!d.selected.length?'disabled':''} onclick="kbBatch(this)">批量操作 ⌄</button><button onclick="kbUpload()">上传</button><button class="kb-dark" onclick="kbNewFile()">＋ 新建</button></div><div class="kb-table-scroll"><table class="kb-table"><thead><tr><th><input type="checkbox" aria-label="全选文件" ${files.length&&d.selected.length===files.length?'checked':''} onchange="kbData().selected=this.checked?kbCurrent().sets[kbData().set].files.map((_,i)=>i):[];render()"></th><th>文件名称</th><th>解析状态</th><th>更新时间 ↕</th><th>启用</th><th>操作</th></tr></thead><tbody>${files.map((f,i)=>`<tr><td><input type="checkbox" aria-label="选择${esc(f.name)}" ${d.selected.includes(i)?'checked':''} onchange="kbSelectFile(${i},this.checked)"></td><td class="kb-file-name" title="${esc(f.name)}"><button class="kb-link" style="color:#333" onclick="kbPreviewFile(${i})">${esc(f.name)}</button></td><td class="kb-success">● ${f.status}</td><td>2026-09-04 11:06:24</td><td><button aria-label="启用${esc(f.name)}" role="switch" aria-checked="${f.enabled}" class="kb-switch ${f.enabled?'on':''}" onclick="kbCurrent().sets[kbData().set].files[${i}].enabled=!kbCurrent().sets[kbData().set].files[${i}].enabled;render()"></button></td><td><button class="kb-link" onclick="kbFileMenu(${i},this)">更多</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#999">暂无文件</td></tr>'}</tbody></table></div><div class="kb-pager"><span>已选择 ${d.selected.length} 项</span><span>共 ${files.length?50:0} 条</span><button onclick="kbPageChange(-1)">‹</button>${[1,2,3,4,5].map(p=>`<button class="${d.page===p?'active':''}" onclick="kbData().page=${p};render()">${p}</button>`).join('')}<span>…</span><button onclick="kbData().page=20;render()">20</button><button onclick="kbPageChange(1)">›</button></div>`}</section></div>`;}
function kbFilterTree(q){document.querySelectorAll('#kb-tree .kb-tree-row').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q.toLowerCase()));}
